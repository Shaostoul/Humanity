# HumanityOS Crew Chore Schema
# Defines a chore an ambient crew NPC can perform: a labeled task at a ship
# location with a dwell duration. The relay's GameWorld walks each crew NPC
# through its role's allowed chores in a deterministic rotation, so crew are
# visibly "completing tasks instead of walking an endless loop".
#
# File format: RON (data/npc/chores.ron, a single top-level list)
# Hot-reloadable: No (loaded once at relay startup)
# Referenced by: src/relay/handlers/game_state.rs (load_chores, tick)
# References: room ids of the relay's world (since increment 3 of
#             docs/design/ship-homes-and-logistics.md: every zone of
#             data/blueprints/ship_structure.ron and every labelled volume in one,
#             src/relay/handlers/ship_world.rs), crew roles from data/npc/crew.ron,
#             and the ship's food stores (data/food/ship_stores.ron) for meals

# ---------------------------------------------------------------------------
# FIELD DEFINITIONS
# ---------------------------------------------------------------------------

[fields.id]
type = "string"
required = true
description = "Unique identifier for this chore, used in sync payloads and logs."
constraints = "snake_case, unique across all chores"
examples = ["tend_towers", "air_handler_readings", "restock_stores"]

[fields.label]
type = "string"
required = true
description = """
Human-readable, present-tense activity line shown to players and AI agents
while the NPC performs the chore (nameplates, perception responses)."""
constraints = "Under 60 characters, present tense, no trailing punctuation"
examples = ["Tending the apothecary towers", "Taking the air handlers' readings"]

[fields.place]
type = "string"
required = true
description = """
The room the chore happens in: a room id of the relay's world (a ship zone
such as "commons", or a labelled volume inside one such as "mess-hall")."""
constraints = "Must be a room id of the relay's world (src/relay/handlers/ship_world.rs shared_rooms)"
examples = ["commons", "mess-hall", "street-1"]

[fields.spot]
type = "(float, float)"
required = true
description = """
Where in the room the crew member stands, as (x, z) metres from the room's
min corner. The NPC walks there in a straight line (no pathfinding yet), so
every walk between two sites of one crew member must cross no wall (a relay
test checks it), and no site may stand on a plot (a home): one that does is
dropped at load."""
constraints = "Inside the room; not on a plot; wall-clear to the role's other sites"
examples = ["(25.0, 13.0)", "(3.0, 4.0)"]

[fields.duration_secs]
type = "float"
required = true
description = "How long the NPC dwells at the chore site in the 'working' state."
constraints = "> 0.0; keep within 10-60 so rotations stay visibly dynamic"
examples = [15.0, 25.0, 30.0]

[fields.roles]
type = "array of strings"
required = true
description = """
Crew roles allowed to perform this chore. An empty list means any crew NPC
may do it. Roles come from the NPC spawn table in game_state.rs
(navigator, medical_officer, chief_engineer, maintenance, botanist,
off_duty)."""
constraints = "Each entry should match at least one spawned crew role"
examples = [["botanist"], ["maintenance", "chief_engineer"], []]

[fields.meal]
type = "bool"
required = false
description = """
A meal (default false): never in the rotation. A crew member who eats does
it when its meal is due and, when it is done, takes one meal from the ship's
food stores in that place: the same stock players take theirs from
(data/food/ship_stores.ron, src/relay/handlers/ship_stores.rs)."""
examples = [true]
