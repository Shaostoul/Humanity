# HumanityOS Pipe Marking Schema
# Defines the two pipe registries under data/piping/ (2026-10-04):
#
#   data/piping/marking_schemes.ron  which coloured bands say WHAT FLOWS in a pipe, per scheme
#   data/piping/pipe_materials.ron   THE ONE CATALOG of what a run is made of: looks, behaviour classes,
#                                    sizes and their specs (spline routing rung 0, 2026-11-02; the
#                                    cable registry data/utilities/conduits.ron merged in)
#
# Read by crates/humanity-ship/src/pipe_marking.rs and crates/humanity-core/src/run_materials.rs (whose ConduitKind
# view is crates/humanity-ship/src/pipe_materials.rs) (disk first, the copy built
# into the exe if the file is missing or does not parse). Drawn by src/engine/pipe_markers.rs
# and src/engine/home_meshes.rs. The research every mapping cites is
# docs/reference/findings/2026-10-04-pipe-marking-standards.md.
#
# File format: RON
# Hot-reloadable: No (read once at first use; restart to apply an edit)
# Referenced by: the connection kinds in data/machines/*.ron and the media a machine type's
#   `outlet_media` names there (a marking row's `content`)
# References: the conduit kinds in crates/humanity-ship/src/conduits.rs (a material row's `kind`)
#
# THE RULE THESE FILES ENCODE: every published marking scheme marks the CONTENT (water, fuel,
# air), never the pipe's material (finding F28). So a pipe's body is drawn in its material, and
# the content's colours appear only in its marker bands. A marker is generated from what the line
# carries, never typed by a player: its connection kind, made specific only by the machine it
# leaves (a machine type's `outlet_media`: water leaving the purifier is potable_water). A line
# is never marked more specifically than that, so untreated water is never marked drinkable.

# ---------------------------------------------------------------------------
# marking_schemes.ron: top level
# ---------------------------------------------------------------------------

[fields.default_scheme]
type = "string"
required = true
description = "The scheme aboard the ship. Must name a scheme in `schemes` and cover every content the game routes (a test checks)."
examples = ["iso_14726"]

[fields.placement]
type = "struct"
required = true
description = "Where markers go along a run and how a band is drawn: interval_m (the largest gap between markers; 6.1 m is GSFC-STD-8006's 20 ft), end_clearance_m, bend_clearance_m, band_m (one band's length), band_radius_scale and band_radius_add_m (band radius = pipe radius x scale + add), band_metallic, band_roughness."

# ---------------------------------------------------------------------------
# marking_schemes.ron: one scheme (schemes[])
# ---------------------------------------------------------------------------

[fields.scheme_id]
type = "string"
required = true
description = "Unique snake_case id of the scheme."
examples = ["iso_14726", "asme_a13_1", "bs_1710"]

[fields.scheme_edition]
type = "string"
required = true
description = "The edition read, and anything about later editions the findings note."

[fields.scheme_cite]
type = "string"
required = true
description = "The finding numbers the scheme's rows come from."
examples = ["F9, F10, F11, F12, F13"]

[fields.scheme_colours]
type = "list"
required = true
description = "The scheme's named colours: id, name, srgb (our 0-255 rendition of the named colour, never a value claimed to come from the standard), note."

# ---------------------------------------------------------------------------
# marking_schemes.ron: one content mapping (schemes[].contents[])
# ---------------------------------------------------------------------------

[fields.content]
type = "string"
required = true
description = "What the line carries: the game's connection kind (the same string a connection carries in data/machines/*.ron), or a more specific medium a machine type's `outlet_media` names for the lines leaving it."
examples = ["water", "potable_water", "condensate", "hot_water", "power", "data", "fuel"]

[fields.name]
type = "string"
required = true
description = "The content as the scheme words it, restated (never a copied table)."

[fields.main]
type = "string"
required = false
description = "Colour id. Simplified mode draws this one band; full mode uses it for the outer bands. Required unless the row is `unmarked`."

[fields.unmarked]
type = "bool"
required = false
description = "True when the scheme deliberately leaves the content unmarked in both modes because no colour it has fits without meaning something else. The row then names no colours and its note says why (ISO 14726's food row: the standard does not cover cargo, F10)."

[fields.additional]
type = "optional string"
required = false
description = "Colour id of the middle band where the scheme has an additional colour (ISO 14726). Full mode draws main, additional, main."

[fields.bands]
type = "list of strings"
required = false
description = "An explicit full-mode band sequence for any other layout (MIL-STD-1247D's two-stripe tape, BS 1710's five-band markers). Must include `main`. Empty = the triple rule above."

[fields.cite]
type = "string"
required = true
description = "The finding numbers this mapping comes from."

[fields.game_choice]
type = "bool"
required = false
description = "True when any part of the mapping is ours (no scheme read covers it, or we picked the additional colour). The note must then say which part."

# ---------------------------------------------------------------------------
# pipe_materials.ron
# ---------------------------------------------------------------------------

[fields.tags]
type = "list"
required = false
description = "The construction words a material may carry and a rule (data/piping/run_rules.ron) may name: id, meaning. A tag used and not declared fails the catalog's test."
examples = ["(id: \"unarmoured\", meaning: \"No metal armour over the cable.\")"]

[fields.kinds]
type = "list"
required = true
description = "One row per conduit kind (crates/humanity-ship/src/conduits.rs ConduitKind::id): kind, material. Which kind carries a content is decided in code, including the potable-water rule recorded there. A mapping, not a fact: no source. Removed by spline routing rung 1 with ConduitKind."
examples = ["(kind: \"rigid_copper\", material: \"copper_l_drawn\")"]

[fields.materials]
type = "list"
required = true
description = "id, name, behaviour (Rigid, Bendable, Flexible), form (Pipe, Cable, Raceway), carries (Utility list; the FIRST is what the cable and data checks file its sizes under), conductor (optional: Copper, Aluminum, Superconductor, Glass), tags, look (srgb 0-255, converted to linear light: our rendition of a dielectric's colour, or a bare metal's MEASURED reflectance; metallic 0..1; roughness 0..1; note), sizes, source, note. Every length in metres."

[fields."materials.sizes"]
type = "list"
required = true
description = "id (unique across the catalog: a connection's spec names one), size (the trade's name), label, dn (ISO 6708 nominal size), od_m, width_m (a flat cable), bore_m, bend_radii [(method: Bender|Free|AgainstCoil|Pulling, min_m, as_read, source)], stick_m, kg_per_m, roughness_m, pressure_kpa, temp_max_c, awg, ampacity_a, voltage_max, ohm_per_m, shielded, flow_max_lpm, bandwidth_mbps, range_m, latency_ms, rf_emission, grade, cost_per_m, note, source. A number with no source is ABSENT, never 0; a size is offered to the cable and data checks only when its check's number (ampacity_a, bandwidth_mbps or flow_max_lpm) is present."

[fields.links]
type = "list"
required = false
description = "Radio links (WiFi): a data medium with no run, so not a material. id, label, carries, conductor, shielded, grade, cost_per_m, bandwidth_mbps, rf_emission, range_m, latency_ms, note, source."

[fields.source]
type = "list"
required = true
description = "On every material, size, bend radius and link row: R(n) (a finding of docs/reference/findings/2026-11-01-pipe-and-cable-routing-rules.md), D(n) (of 2026-11-01-manual-door-releases.md) or Ours(\"why\"). A test reads the documents' numbered paragraphs and fails on a row with none or a finding that does not exist. The same field and check hold in run_rules.ron, fittings.ron, anchors.ron and benders.ron (their field references are in each file's header)."
examples = ["[R(1)]", "[R(19), Ours(\"the 600 V rating is the one NM-B is printed with\")]"]