# HumanityOS Skill Schema
# Defines the skill data: data/skills/skills.csv (one row per skill), data/skills/families.json,
# data/skills/stages.json (the named stages and every skill's ladder) and data/skills/practice.json
# (what each live verb teaches).
#
# Design: docs/design/skills.md, approved by the operator on 2026-11-14 ("I'm happy with the list.
# I'm happy with all your suggestions in the skills.md."). Skills rung 1 rebuilt the data to this
# shape on 2026-11-14: the twenty old rows became the base set of 90 skills in 11 families.
#
# A skill is a body of DOING, earned by doing the real procedure (skills.md section 1). Knowledge
# lives in the curriculum (data/curriculum/syllabus.json); actions you trigger live in
# data/abilities.csv, gated by a skill level.
#
# File format: CSV (comma-separated, # lines are comments, no quoting: no commas in a cell)
# Engine structs: SkillDef, StageStep, SkillProgress, PlayerSkills, SkillRegistry, Practice
#                 (crates/humanity-systems/src/skills/mod.rs)
# Loaded by: src/engine/registries.rs into DataStore["skill_registry"]
# Referenced by: data/recipes.csv (skill_required, skill_level), data/abilities.csv
#                (skill_required, skill_level), data/equipment.csv (skill: a weapon's combat skill),
#                data/quests/*.ron (xp_rewards), data/curriculum/syllabus.json (skills),
#                data/how_to/**/*.json (skills), data/gameplay/activities.json (skills)
# Checked by: tests/skills_data_lint.rs, tests/activities_catalog_lint.rs, and the lib tests in
#             crates/humanity-systems/src/skills/skill_tests.rs

# ---------------------------------------------------------------------------
# THE RULES FOR THE SET (skills.md section 1)
# ---------------------------------------------------------------------------
#
# 1. A skill is real and assessable: someone could watch a person and say whether they can do it.
# 2. It splits where the movement or the knowledge is genuinely different (a staff is not a whip),
# 3. and only once the game can teach the difference (dance stays one skill until the dance
#    activity teaches two styles).
# 4. No skill without a trainer: every row is trained by at least one activity in
#    data/gameplay/activities.json, or its untrained_reason says why not yet.
# 5. Transfers are declared, never assumed (transfers column).
# 6. One activity may train several skills (activities.json "skills" is a list).
#
# There is NO cap: levels go on past Master. The operator, 2026-11-14: "Let's not focus on a cap."

# ---------------------------------------------------------------------------
# data/skills/skills.csv FIELDS
# ---------------------------------------------------------------------------

[fields.id]
type = "string"
required = true
description = """
Unique identifier for this skill. The key in SkillRegistry, in save files (WorldSave.skills maps
id to level and XP) and in every file listed under "Referenced by". Its words are i18n keys built
from it: skills.<id>.name and skills.<id>.desc in data/i18n/en.json (add them with
node scripts/i18n-add.js)."""
constraints = "snake_case, globally unique"
examples = ["mining", "smithing", "baking", "staff_spinning", "self_defence"]

[fields.family]
type = "string"
required = true
description = "The family it is listed under on the Skills page: an id in data/skills/families.json. A family has no level of its own."
examples = ["body", "food", "making", "building", "travel", "science", "safety", "combat", "community", "flow", "arts"]

[fields.xp_per_level]
type = "integer"
required = true
default = 100
description = """
The XP base. Going from level L-1 to level L costs xp_per_level x L^1.5 (rounded down), with no top
level. The website's table data/skills/xp_curve.json is this rule at base 100."""
examples = [80, 100, 150, 200]

[fields.transfers]
type = "string"
required = false
description = """
Declared head starts into other skills, as id:fraction pairs joined by |. When the player is better
at this skill than at the other, XP into the other is multiplied by 1 + fraction (the largest
declared one). A transfer speeds learning; it never grants stages."""
examples = ["polearms:0.25|twirling:0.25", "rope_dart:0.25"]

[fields.untrained_reason]
type = "string"
required = false
description = "Why no activity trains this skill yet (a later row the operator named). Empty when an activity trains it."
examples = ["Later row: no activity teaches it yet; the operator named it (skills.md section 7)"]

# ---------------------------------------------------------------------------
# data/skills/stages.json
# ---------------------------------------------------------------------------
#
# stages: the stage ids in order with their default starting level:
#   untrained 0, novice 1, beginner 3, competent 5, proficient 8, expert 12, master 17.
#   Words: skill_stages.<id>.name and skill_stages.<id>.meaning.
# ladders: per skill id, its six stages (novice to master) in order:
#   { "stage": "novice", "from_level": 1, "can": ["skills.<id>.s1_a"] }
#   from_level must rise from stage to stage; can lists the i18n keys of the stage's "I can"
#   statements (1 or 2 per stage; every lower statement stays required).
# A stage is the band of levels from its from_level to the next stage's. The recipe gates
# (skill_level 0 to 5 today) sit inside Novice to Competent; the starter tier (0 and 1) is always
# open.

# ---------------------------------------------------------------------------
# data/skills/practice.json
# ---------------------------------------------------------------------------
#
# practices: verb id -> { skills: [...], xp: N, per_metres: M (continuous verbs only) }.
# The code names the verb when the player completes it (skills::practice and its kin); the table
# says which skills it trains. XP is then weighed by the SkillSystem (skills::practice_weight):
# difficulty against the player's level (x0.1 far below to x1.25 at or just above) and the
# result's quality where the verb grades it (x0.5 to x1.5).

# ---------------------------------------------------------------------------
# EXAMPLE
# ---------------------------------------------------------------------------

[example]
csv = """
id,family,xp_per_level,transfers,untrained_reason
baking,food,100,,
staff_spinning,flow,100,polearms:0.25|twirling:0.25,
whip,flow,100,,Later row: no activity teaches it yet; the operator named it (skills.md section 7)
"""
