# HumanityOS Plant Schema
#
# Defines the structure of `data/plants.csv`, which is one row per plant species
# and is the data layer behind most of the Library's growing guides.
#
# This schema was missing until 2026-09-15 while 24 other content types had one,
# which is why `plants.csv` accumulated a header comment that had drifted from
# the file (it listed six `type` values where the data uses ten, and stopped one
# column short of the end).
#
# WHAT READS THIS FILE
#   src/systems/farming/           -- `PlantDef` (mod.rs) deserializes each row.
#                                     Growth, water, nutrients, pH, temperature,
#                                     humidity, yield and stages all drive the
#                                     farming simulation from here.
#   src/assets/                    -- AssetManager loads and hot-reloads it.
#   src/embedded_data.rs           -- embedded at compile time so a bare exe works.
#   data/food/crop_nutrition.ron   -- one entry per FOOD row here, keyed on `id`,
#                                     bridging yield to calories.
#   data/curriculum/syllabus.json  -- the `bio_plants` and `grow_pests` topics
#                                     declare this file as their data layer.
#
# EIGHT COLUMNS ARE NOT READ BY THE ENGINE AT ALL. `PlantDef` carries 24 of the
# 32 (counted 2026-09-26, after the three removal columns and area_per_plant_m2). `description` and
# `type` are documentation for a human or an AI reading the file; `seed_value`,
# `harvest_value`, `seed_source`, `companion_plants` and `adverse_plants` are
# read by nothing in `src/` today. They are content waiting for a system, not
# dead weight, but do not assume editing one changes anything in the game. Each
# is marked `engine = false` below. The eighth is `skill_required`: it is marked
# `engine = true` below, but no plant loader reads it (the `skill_required` the
# crafting page reads is recipes.csv's).
#
# FILE FORMAT. Unquoted CSV, one plant per row, `#` comment lines at the top.
# A field may therefore NOT contain a comma; the file uses semicolons inside
# prose and colons to separate list items. An edit script that puts a comma in a
# description shifts every later column, which has happened.

# ── Field Definitions ────────────────────────────────────────────

[fields.id]
type = "string"
required = true
engine = true
description = "Unique identifier, snake_case. The lookup key everywhere, including crop_nutrition.ron and any curriculum reference."
constraints = "Unique across the file. Lowercase alphanumeric and underscores."
example = "tomato"

[fields.name]
type = "string"
required = true
engine = true
description = "Display name shown to the player."
example = "Tomato"

[fields.description]
type = "string"
required = true
engine = false
description = "One line for a human reading the file. No comma, because this is unquoted CSV."
example = "Fresh red tomatoes - heavy feeder requiring consistent moisture"

[fields.type]
type = "string"
required = true
engine = false
description = """
Broad category. The file uses ten: vegetable, fruit, herb, grain, legume, alien,
tree, medicinal, decorative, fiber. NOTE that three rows typed `vegetable` are
fungi (oyster_mushroom, shiitake, button_mushroom) and several columns mean
something different for them, because a mushroom has no roots drawing a soil
solution and no leaves transpiring."""
example = "fruit"

[fields.growth_days]
type = "float"
required = true
engine = true
description = """
Real-world days from the propagule the row is actually started from to harvest.
Not always from seed: garlic counts from the clove, sweet potato from the slip.
The file's own header carries the per-row exceptions."""
example = "70"

[fields.water_liters_per_day]
type = "float"
required = true
engine = true
description = """
Litres PER PLANT per day. Read as `water_per_day` in PlantDef; a grow unit's
irrigation draws this times the plants in it (area_per_plant_m2). For every crop
with an area_per_plant_m2 and a row in FAO-56 Table 12 (2026-09-26) it is the
FAO crop evapotranspiration over that area: season-average Kc x a reference ET0
of 3 mm/day x area_per_plant_m2. Method and old and new values are in
data/garden/yields.ron, WATER."""
example = "0.0077"

[fields.nutrient_n]
type = "float"
required = true
engine = true
description = """Relative nitrogen demand, higher is hungrier. NOT kilograms: tomato 0.15 is no real per-plant or per-hectare figure. Since 2026-09-26 the farming sim reads it (src/systems/farming/soil.rs) ONLY for a crop whose removal_n_g_per_kg is blank: that crop needs, each season, its expected harvest in kg times the anchor crop's published N removal per kg (data/garden/nutrients.ron: tomato, 1.5 g/kg, CDFA FREP) times this index over the anchor's. Its unit of growing space holds a store of available N that the crop draws down as it grows. Known weakness, and why the removal columns exist: the indices understate dense harvests (grain, dry legumes) 5 to 20 times against extension removal tables."""
example = "0.15"

[fields.nutrient_p]
type = "float"
required = true
engine = true
description = "Relative phosphorus demand, read the same way as nutrient_n (and only where removal_p2o5_g_per_kg is blank), counted as grams of P2O5 (anchor: tomato 0.9 g P2O5 per kg, UW-Madison A2809 Table 4.2)."
example = "0.05"

[fields.nutrient_k]
type = "float"
required = true
engine = true
description = "Relative potassium demand, read the same way as nutrient_n (and only where removal_k2o_g_per_kg is blank), counted as grams of K2O (anchor: tomato 4.0 g K2O per kg, UW-Madison A2809 Table 4.2)."
example = "0.20"

[fields.ph_min]
type = "float"
required = true
engine = true
description = "Low end of the preferred soil or reservoir pH window."
example = "6.0"

[fields.ph_max]
type = "float"
required = true
engine = true
description = "High end of the preferred pH window."
example = "6.8"

[fields.temp_min_c]
type = "float"
required = true
engine = true
description = "Low end of the tolerated temperature window, Celsius."
example = "18"

[fields.temp_max_c]
type = "float"
required = true
engine = true
description = "High end of the tolerated temperature window, Celsius."
example = "30"

[fields.humidity_min]
type = "float"
required = true
engine = true
description = "Low end of the preferred relative humidity window, 0 to 1."
example = "0.50"

[fields.humidity_max]
type = "float"
required = true
engine = true
description = "High end of the preferred relative humidity window, 0 to 1."
example = "0.80"

[fields.yield_min]
type = "float"
required = true
engine = true
description = """
Minimum harvest from ONE plant, counted in items of `harvest_item` (so its kg is
this times the item's items.csv weight_kg). A grow unit harvests this times the
plants in it: one for a tower cup or a hand-planted crop, as many as fit at
area_per_plant_m2 for a bed, tray or field plot. For every crop with an
area_per_plant_m2 (2026-09-26) it is a cited good-practice harvest, sourced crop
by crop in data/garden/yields.ron, and for a crop picked or cut over a season it
is the whole season's pick. FLOAT, not integer, because a plant usually gives
far less than one item: a wheat plant is 0.0019 of a 0.5 kg item, a saffron corm
0.00027 of a 50 g one. The harvest roll converts the continuous total to whole
inventory items by probabilistic rounding so the expected value is preserved.
This was u32 once, which made serde reject every fractional row and silently
drop it from the registry; saffron was un-plantable for months before the
2026-07-01 fix."""
example = "0.001856"

[fields.yield_max]
type = "float"
required = true
engine = true
description = "Maximum harvest from one plant, same basis and float rule."
example = "0.002118"

[fields.growth_stages]
type = "list<string>"
required = false
engine = true
separator = ":"
description = """
Ordered stage names. Empty falls back to DEFAULT_GROWTH_STAGES. Fungi use a
different ladder (spore:mycelium:pinning:fruiting) and that is correct.
There is NO failure branch in any row: no damaged, infected, wilting or dead
state exists, so a diagnostic skill has nothing to attach to. Reported by the
writer of the pests and disease guide as a gap, not a defect."""
example = "seed:sprout:vegetative:flower:fruit:ripe"

[fields.seasons]
type = "list<string>"
required = true
engine = true
separator = ":"
description = "Preferred growing seasons."
example = "spring:summer"

[fields.seed_value]
type = "float"
required = true
engine = false
description = "Base trade value of seeds, credits. Read by nothing in src/ today."
example = "5"

[fields.harvest_value]
type = "float"
required = true
engine = false
description = "Base trade value of the harvested crop, credits. Read by nothing in src/ today."
example = "15"

[fields.skill_required]
type = "integer"
required = true
engine = true
description = "Minimum farming skill level to plant this."
example = "1"

[fields.seed_source]
type = "list<string>"
required = true
engine = false
separator = ":"
description = "Where seeds can be obtained. Read by nothing in src/ today."
example = "store:trade"

[fields.companion_plants]
type = "list<plant id>"
required = false
engine = false
separator = ":"
description = """
Plants that grow well nearby. Read by nothing in src/ today, so an edit here
changes documentation rather than behaviour.

TWO THINGS TO KNOW BEFORE EDITING. 167 of these relations are ASYMMETRIC (A
lists B, B does not list A). Nothing is listed as both companion and adverse and
no id dangles, so that is probably deliberate, but it deserves a decision rather
than continued drift.

And a companion claim is a factual claim about the world, so it needs a source
like any other. The `marigold` row asserted a general pest-repelling effect and
listed tomato, pepper and bean, and its own best source (NC State Extension)
says dense season-long planting reduces some root-knot nematodes and says in
terms that a few marigolds mixed in among susceptible plants will not be
sufficient. The row encoded the one arrangement the evidence refutes. It was
corrected 2026-09-15."""
example = "basil:carrot:parsley"

[fields.adverse_plants]
type = "list<plant id>"
required = false
engine = false
separator = ":"
description = "Plants that should not be grown nearby. Read by nothing in src/ today. Same sourcing standard as companion_plants."
example = "fennel"

[fields.harvest_item]
type = "string"
required = false
engine = true
description = """
The `data/items.csv` id this crop harvests into. Explicit per row so herbs,
legumes, mushrooms and fiber crops harvest to real items instead of logging a
warning. Empty falls back to the legacy vegetable_/fruit_/grain_ prefix search,
so pre-column data still works."""
example = "vegetable_tomato_0"

[fields.needs_light]
type = "bool"
required = false
engine = true
description = """
Whether the species needs light to grow at all (added 2026-09-26, gardening
depth rung 2). `true` for every green plant: the farming sim grows it only
while its grow area is lit (the sun for a field; the sun or a powered grow
light indoors) and pauses it in the dark, without harming it. `false` for the
fungi (oyster_mushroom, shiitake, button_mushroom, and the fictional
shadow_fungi and phase_mushroom), which the sim grows at the calendar rate in
light or dark.

Source for the fungi: Penn State Extension, "Basic Procedures for Agaricus
Mushroom Growing" (read 2026-09-26): "Mushrooms lack the ability to use energy
from the sun. They are not green plants because they do not have chlorophyll."
The same sheet adds that mushrooms "are usually grown in the absence of light,
darkness is not a requirement". Oyster and shiitake do use some light as a cue
to form well-shaped fruit bodies; that is a shape signal, not the energy they
grow on, and it is not modelled.

This says nothing about HOW MUCH light a plant needs (see Known gaps below).
Blank or absent reads as `true`, so a row can never be dropped over it."""
example = "true"

[fields.n_fixed_pct]
type = "float"
required = false
engine = true
description = """
Share of the crop's nitrogen it fixes from the air, as a percent: the %Ndfa
("N derived from the atmosphere") that legume studies report (added
2026-09-26, closing the garden's nitrogen loop). The farming sim
(src/systems/farming/soil.rs) draws only the other share of the crop's N need
from its unit (`soil_draw`), and when the crop is harvested it leaves the
fixed N held in its roots, nodules and haulm in the unit as a credit for the
next crop (`legume_credit_n`, with the harvest's share of whole-plant N from
data/garden/nutrients.ron `legume_harvest_n_share`).

Filled only where a figure was found; the sources are in the plants.csv
header. Soybean 55 (Salvagiotti et al. 2008: "50-60%"); fava bean 67, pea 54,
lentil 54, chickpea 52 and the common beans 26 (Hossain et al. 2017, three
semiarid seasons in Saskatchewan). Other legumes fix nitrogen too but have no
figure yet and are blank. Blank, absent or unparseable reads as 0 (no
fixation) and never drops the row: the loader parses it from text."""
example = "55"

[fields.removal_n_g_per_kg]
type = "float"
required = false
engine = true
description = """
Grams of N that one kg of this crop's harvest carries out of its unit of
growing space (added 2026-09-26). The basis is the harvest as the game's
harvest item represents it: fresh produce as picked, grain and dry seed at
the storage moisture its source table reports. The farming sim
(src/systems/farming/soil.rs, `removal_per_kg`) takes a crop's season need of
N as this times its expected harvest in kg; a legume still fixes its
n_fixed_pct share of it from the air.

Blank means not sourced yet: that crop's N need then falls back to nutrient_n
read against the anchor crop (data/garden/nutrients.ron), as every crop did
before this column. Each of the three removal columns falls back on its own.

Every filled value, and the table cell it came from, is listed in
data/garden/nutrients.ron under REMOVAL COLUMNS. In short: grain, dry pulses
and oilseeds from USDA NRCS Agricultural Waste Management Field Handbook
Table 6-6; fresh produce from the nitrogen USDA measured in the food
(FoodData Central SR Legacy protein over its nitrogen factor), except the
tomato, which keeps the anchor's CDFA figure. The shipped-data test
`shipped_removal_columns_are_read_and_plausible` holds every value between
0.5 and 80 g/kg and within 0.65 to 1.4 times the N in the crop's own protein
(data/food/crop_nutrition.ron), which catches a pound-per-ton figure typed
as grams per kg. Blank, absent, unparseable, zero or negative reads as blank
and never drops the row; the test fails on any filled cell that does not
read."""
example = "20.8"

[fields.removal_p2o5_g_per_kg]
type = "float"
required = false
engine = true
description = """
Grams of P2O5 per kg of harvest, same basis and same fallback (to nutrient_p)
as removal_n_g_per_kg. Mostly UW-Madison A2809 Table 4.2, the table the
anchor already uses; otherwise NRCS Table 6-6 (P x 2.29) or FoodData Central
(P x 2.29). Held between 0.3 and 25 g/kg and between 0.08 and 1.8 times the
crop's removal N."""
example = "8.33"

[fields.removal_k2o_g_per_kg]
type = "float"
required = false
engine = true
description = """
Grams of K2O per kg of harvest, same basis and same fallback (to nutrient_k)
as removal_n_g_per_kg. Sources as for removal_p2o5_g_per_kg, with K x 1.2.
Held between 1 and 30 g/kg and between 0.1 and 6 times the crop's removal N."""
example = "5.83"

[fields.area_per_plant_m2]
type = "float"
required = false
engine = true
description = """
Floor area one plant takes, m2: the in-row x between-row spacing a university
extension or planting guide gives (for drilled cereals and pulses, 1 / the
recommended established plants per m2). A bed, tray or field plot holds
floor(plot floor area / this) plants, at least 1; a tower cup and a hand-planted
crop hold one (src/systems/farming/units.rs). Blank means one plant a unit, the
behaviour before 2026-09-26. Every filled value has a record in
data/garden/yields.ron with its source, and the shipped-data test in
src/systems/farming/unit_tests.rs holds each crop's harvest per m2 to a band for
its kind of harvest, so a per-m2 figure typed as per-plant fails."""
example = "0.003"

# ── Known gaps, so nobody rediscovers them ───────────────────────
#
# These are things the file CANNOT express that the Library's guides say matter.
# Each is a real content decision, not an oversight to be silently patched.
#
#   No light AMOUNT or shade-tolerance column. `needs_light` says only whether
#     a species needs light at all. The daily light integral a crop wants and
#     its compensation point, which is the budget governing whether a plant can
#     live where you put it, have no field, so the sim cannot yet scale growth
#     under weak light or saturate it under strong light.
#   No photoperiod or vernalization field, so bolting cannot emerge from the
#     data and can only be scripted.
#   No pollination mode, which is the thing saving_your_own_seeds.md turns on:
#     whether saved seed comes true depends on it.
#   No rooting depth, and no drainage or soil-oxygen field.
#   No pest or disease susceptibility, and no resistance. Choosing a resistant
#     variety is the single most effective control on the whole response ladder
#     in pests_and_disease.md, and it is inexpressible here.
#   No picking window. growth_days is days to the FIRST harvest and the game
#     picks a crop once, while a crop picked or cut over a season (tomato,
#     cucumber, kale, every cut herb) carries its whole season's pick in
#     yield_min/yield_max. A unit replanted back to back therefore yields a
#     season's pick every growth_days: about 2 to 3 times a real tomato's year,
#     9 times a tower basil's. A column for the picking season (and a crop that
#     keeps producing after it first ripens) is what closes it.
