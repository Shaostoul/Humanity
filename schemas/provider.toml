# ---------------------------------------------------------------------------
# MISSING / FUTURE (deliberately unspecified, and why)
# ---------------------------------------------------------------------------

[missing_future]
verification_mechanism = """
NOT SPECIFIED: how a domain proof is actually fetched and checked, what the
.well-known document contains, who is allowed to issue a manual verification,
and how a verification is revoked. Deliberate: increment 1 is the shape, and
increment 4 is the trust layer (docs/design/market-directory.md). The schema
carries the claim honestly in the meantime, and `[verification_rules]` makes
sure a client cannot mistake a claim for a proof. When the mechanism ships it
adds a provider_verification_v1 object type and pointers in
`attestation_refs`; nothing in this file changes."""
provider_kind_list = """
NOT DATA-DRIVEN YET: `kind` is an inline valid_values list rather than a file
under data/market/. That is a knowing exception to infinite-of-X, taken
because the list is small, slow-moving, and must mean the same thing on every
federated server for filters to work. If it starts growing, move it to
data/market/provider_kinds.ron and keep the ids stable."""
multi_location_chains = """
PARTLY SOLVED: `service_areas` handles a handful of places, and a region entry
handles a national footprint. A chain with a thousand branches, each with its
own stock, needs one provider per branch plus a `branch_of` link to a parent
provider, which does not exist yet. Not needed to launch, and inventing it
before a real chain federates would be guesswork."""
opening_hours = """
NOT SPECIFIED at provider level: structured weekly hours live on service
offerings (offering_v1 `service.availability`), and a provider's rough hours go
in `contact.notes` as text for now. A shared hours structure is worth adding
once the service branch has proven its shape in real use."""
moderation_and_delisting = """
NOT IN THIS SCHEMA, on purpose. A provider cannot mark itself delisted and a
server operator cannot edit somebody else's signed object. Delisting is a
server-side decision about what a server SURFACES (gap 4 in the design doc),
so it belongs in a local blocklist table plus, later, a signed moderation log
that other servers can choose to honour."""
reputation = """
NOT HERE: ratings and reviews attach to offerings and to completed exchanges,
not to the provider object, and the platform records no exchanges today
(settlement is directory-only). Pulling a rating into a self-signed object
would let a provider sign its own five stars."""
key_rotation = """
KNOWN LIMITATION: a provider's identity is its author key, and today the DID
changes when the key rotates (src/relay/core/did.rs). Until stable DIDs land,
a rotation means republishing the root and re-pointing offerings. Do not build
anything that assumes a provider survives a rotation."""
