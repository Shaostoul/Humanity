# How-to schema
#
# WHAT A HOW-TO IS
# One procedure as data: what it achieves and for whom, how long it takes, what
# you need, the steps (to tick off, with timers where a step waits, checks where
# you test something, and safety notes at the step where they matter), how to
# tell it worked, what goes wrong and what to do then, and where its facts come
# from with dates. The design, and every reason behind these fields, is
# docs/design/how-to.md; read it before adding a field.
#
# THIS FILE IS EXECUTABLE
# scripts/build-how-to.js reads the [fields."..."] tables below and refuses a
# how-to whose shape does not match them: a missing required field, a field
# that is not listed here, the wrong type, a value outside an enum. The Rust
# model (src/how_to/model.rs) refuses the same files through serde with
# `deny_unknown_fields`. tests/fixtures/how_to/base.json uses every field listed
# here, and a test fails when this file lists a field the fixture does not use,
# so this file, the fixture and the two checkers cannot drift apart.
#
# Field paths: `steps[].kind` is the `kind` of every element of the `steps`
# array. A field marked `required = true` is required when its parent exists.
#
# Types:
#   id            snake_case: a lower-case letter, then lower-case letters, digits
#                 or underscores. Stable: never renamed, never reused.
#   string        a non-empty line of text, shown to people.
#   text          a paragraph (may be long).
#   date          YYYY-MM-DD.
#   int           a WHOLE number, 0 or more. A how-to becomes a signed object in
#                 canonical CBOR (docs/design/how-to.md, "Sharing and signing"),
#                 and canonical CBOR has no floating point, so every number in a
#                 how-to is whole: write 500 ml, not 0.5 l. The checker refuses
#                 any other number anywhere in the file (gate whole_numbers).
#   bool          true or false.
#   enum          one of `values`.
#   object        a JSON object whose fields are listed below it.
#   map<string>   an object whose keys are chosen by the author and whose values
#                 are strings (only `steps[].if`).
#   array<T>      a list of T. `min_items` when it may not be empty.
#
# THE GATES
# Shape is only the first check. The checker (src/how_to/check.rs and
# web/shared/how-to-logic.js, the same rules in both) also refuses: a safety
# note shown in Full but hidden in Short, a serious or lethal note with no short
# line, a how-to whose hazard is lower than its worst step, a number in a
# serious or lethal how-to's step that cites nothing, a review that no longer
# matches the words it checked, a lethal how-to marked checked without a
# person's dated review, and references to items, recipes, skills, topics,
# Library documents, sources, roles, pages and other how-tos that do not exist.
# Every gate has a fixture in tests/fixtures/how_to/broken.json that it must
# refuse, so each one is seen red on every run.

[schema]
name = "how_to"
file = "data/how_to/<top category id>/<id>.json"
index = "data/how_to/index.json (generated by scripts/build-how-to.js)"
description = "One procedure: its purpose, needs, steps, checks, problems, help and sources."

# ── Who it is for and where it sits ──

[fields.id]
type = "id"
required = true
description = "Stable. The file is named <id>.json. Never renamed or reused: runs, repeats, calls and Library embeds name it."

[fields.title]
type = "string"
required = true
description = "What a person types into a search box: 'Change a furnace filter'. An imperative, in plain words."

[fields.summary]
type = "string"
required = true
description = "One sentence: what doing it achieves."

[fields.for]
type = "string"
required = true
description = "Who it is for and what they need to know first, in a sentence."

[fields.audience]
type = "enum"
values = ["everyone", "server_owner", "developer"]
required = false
description = "everyone (the default); server_owner (shown in HumanityOS > Running a server); developer (shown only with Developer mode on)."

[fields.category]
type = "id"
required = true
description = "One node of data/how_to/categories.json. The file's folder is that node's top-level ancestor (gate folder)."

[fields.tags]
type = "array<id>"
required = false
description = "Tag ids from the Library's vocabulary, data/library/tags.json (gate tag_unknown)."

[fields.realities]
type = "array<enum>"
values = ["real", "sim"]
min_items = 1
required = true
description = "real: done in real life, shown on the How-to page. sim: the game models it, shown on the Crafting page (increment 4). Both is allowed."

[fields.apps]
type = "array<enum>"
values = ["desktop", "website"]
required = false
description = "Which HumanityOS apps the steps are written for, when that matters (a how-to about the app's own Settings). Omitted means both, or that the app does not matter."

# ── Time, difficulty, hazard ──

[fields.time]
type = "object"
required = true
description = "How long it takes."

[fields."time.active_min"]
type = "int"
required = true
description = "Minutes of hands-on work."

[fields."time.waiting_min"]
type = "int"
required = true
description = "Minutes of waiting (a timer running, jars cooling). 0 when there is none."

[fields.difficulty]
type = "int"
min = 1
max = 5
required = true
description = "1 Easy, 2 Some practice, 3 Takes care, 4 Hard, 5 Expert. Shown as words (data/how_to/words.json)."

[fields.hazard]
type = "enum"
values = ["none", "caution", "serious", "lethal"]
required = true
description = """
How badly a person can be hurt by doing it wrong: the Curriculum's scale and
meaning (schemas/curriculum_topic.toml). Shown as a word and an icon, never
colour alone: lethal "Can kill you if done wrong", serious "Can seriously hurt
you", caution "Take care". At least the highest step's safety level (gate
hazard_below_step). A serious or lethal how-to without a stop_and_call entry
is a warning.
"""

# ── What it connects to ──

[fields.skills]
type = "array<id>"
required = false
description = "Skill ids from data/skills/skills.csv it practises (gate skill_unknown)."

[fields.topics]
type = "array<id>"
required = false
description = "Curriculum topic ids, data/curriculum/syllabus.json (gate topic_unknown)."

[fields.reading]
type = "array<string>"
required = false
description = "Library document slugs (the /library#slug grammar) that explain why (gate reading_unknown)."

[fields.needs_first]
type = "array<id>"
required = false
description = "How-tos (written or planned) to know before this one (gate needs_unknown)."

[fields.roles]
type = "array<id>"
required = false
description = "Reserved: the roles of a crew doing it together (a step's `who`). Shown in a later increment."

# ── What you need ──

[fields.tools]
type = "array<object>"
required = false
description = "Things used and kept. In the game a listed tool with durability wears by one use."

[fields."tools[].item"]
type = "id"
required = false
description = "A data/items.csv id (gate item_unknown). One of item or proposed_item."

[fields."tools[].proposed_item"]
type = "string"
required = false
description = "A real thing the item taxonomy does not have a row for yet, named in words, the way an offering's proposed_item is."

[fields."tools[].qty"]
type = "object"
required = false
description = "How many or how much: value, or min and max, and a unit."

[fields."tools[].qty.value"]
type = "int"
required = false
description = "The amount, in `unit`."

[fields."tools[].qty.min"]
type = "int"
required = false
description = "The least, for a range."

[fields."tools[].qty.max"]
type = "int"
required = false
description = "The most, for a range."

[fields."tools[].qty.unit"]
type = "enum"
values = ["each", "g", "kg", "ml", "l", "mm", "cm", "m"]
required = true
description = "Stored in metric and shown in the person's units once that setting exists. Whole numbers only: pick the unit that makes the amount whole."

[fields."tools[].optional"]
type = "bool"
required = false
description = "Needed only sometimes; the note says when."

[fields."tools[].note"]
type = "string"
required = false
description = "Which one, or when it is needed."

[fields.materials]
type = "array<object>"
required = false
description = "Things used up. The real quantities (the game's balanced transform is `makes`)."

[fields."materials[].item"]
type = "id"
required = false
description = "As tools[].item."

[fields."materials[].proposed_item"]
type = "string"
required = false
description = "As tools[].proposed_item."

[fields."materials[].qty"]
type = "object"
required = false
description = "As tools[].qty."

[fields."materials[].qty.value"]
type = "int"
required = false
description = "As tools[].qty.value."

[fields."materials[].qty.min"]
type = "int"
required = false
description = "As tools[].qty.min."

[fields."materials[].qty.max"]
type = "int"
required = false
description = "As tools[].qty.max."

[fields."materials[].qty.unit"]
type = "enum"
values = ["each", "g", "kg", "ml", "l", "mm", "cm", "m"]
required = true
description = "As tools[].qty.unit."

[fields."materials[].optional"]
type = "bool"
required = false
description = "As tools[].optional."

[fields."materials[].note"]
type = "string"
required = false
description = "As tools[].note."

# ── Stop and call ──

[fields.stop_and_call]
type = "array<object>"
required = false
description = "Shown first, in both views, before the steps: when to stop and get help instead."

[fields."stop_and_call[].when"]
type = "string"
required = true
description = "What the person sees or knows: 'You smell gas.'"

[fields."stop_and_call[].do"]
type = "string"
required = true
description = "What to do instead, at once."

[fields."stop_and_call[].who"]
type = "string"
required = false
description = "Who to call: role:<id> resolves through the person's locale (data/locales/<id>/locale.json `authorities`, a role in data/sources/registry.json; gate role_unknown), or plain words."

[fields."stop_and_call[].cites"]
type = "array<id>"
required = false
description = "Keys of this how-to's sources behind the entry (gate cite_unknown). In a serious or lethal how-to an entry that states a number must cite (gate uncited_number)."

# ── The steps ──

[fields.steps]
type = "array<object>"
min_items = 1
required = true
description = "In order. A step's state in a run is keyed by its id, so reordering or editing keeps a person's ticks."

[fields."steps[].id"]
type = "id"
required = true
description = "Unique in this how-to (gate step_id_duplicate). Never reused for a different step."

[fields."steps[].kind"]
type = "enum"
values = ["do", "wait", "check", "measure", "choose", "call", "go", "action", "command"]
required = true
description = """
do      a line to tick.
wait    a timer: `wait`. The due time is stored, so it runs while the app is closed.
check   a question with Yes and No; No goes to `no` (a problem id or a step id).
measure a value to write down: `record`.
choose  one of a few `options`; later steps show or hide by `if`.
call    another how-to, named by `how_to` (gate call_unknown).
go      a button opening a page (`page`, and `section` on Settings) of this app (gate page_unknown).
action  an admin action from data/admin/ops_registry.json by id (gate action_unknown: the registry has no ids until increment 6).
command a command to type, with Copy: `command`, `shell`.
Each kind carries its own fields and no other kind's (gate kind_fields).
"""

[fields."steps[].text"]
type = "string"
required = true
description = "A short imperative sentence, shown in both views."

[fields."steps[].why"]
type = "array<text>"
required = false
description = "Why the step is there. Full view only."

[fields."steps[].detail"]
type = "array<text>"
required = false
description = "More about doing it. Full view only."

[fields."steps[].safety"]
type = "object"
required = false
description = "A safety note at the step where it matters."

[fields."steps[].safety.level"]
type = "enum"
values = ["caution", "serious", "lethal"]
required = true
description = "How badly a person can be hurt here. The how-to's hazard is at least this (gate hazard_below_step)."

[fields."steps[].safety.short"]
type = "string"
required = false
description = "The line shown in BOTH views. Required for serious and lethal (gate safety_without_short): Short shortens, it never omits."

[fields."steps[].safety.full"]
type = "array<text>"
required = false
description = "The whole note, in the Full view."

[fields."steps[].uses"]
type = "array<id>"
required = false
description = "The tools and materials this step needs, by item id; each must be in the how-to's tools or materials (gate uses_unlisted)."

[fields."steps[].image"]
type = "object"
required = false
description = "A picture under assets/how_to/<how-to id>/, public domain or our own."

[fields."steps[].image.file"]
type = "string"
required = true
description = "The file name in assets/how_to/<how-to id>/."

[fields."steps[].image.alt"]
type = "string"
required = false
description = "What the picture shows, for someone who cannot see it. Required (gate image_without_alt)."

[fields."steps[].cites"]
type = "array<id>"
required = false
description = "Keys of this how-to's `sources` behind the step's facts (gate cite_unknown). In a serious or lethal how-to a step that states a number must cite (gate uncited_number)."

[fields."steps[].time_min"]
type = "int"
required = false
description = "Hands-on minutes for this step, when long enough to matter."

[fields."steps[].who"]
type = "id"
required = false
description = "Reserved: a role from `roles`, for work done by several people."

[fields."steps[].if"]
type = "map<string>"
required = false
description = "Show this step only when an earlier choose step picked an option ({\"<choose step id>\": \"<option id>\"}) or, with the key `place`, in a jurisdiction of data/laws/laws.json (gate if_unknown)."

[fields."steps[].sim"]
type = "object"
required = false
description = "How the game sees this step (increment 5)."

[fields."steps[].sim.mode"]
type = "enum"
values = ["watch", "read", "skip"]
required = true
description = "watch: ticked by a game event (kind, target); read: the player confirms it, because the game cannot observe it; skip: the game does not model it."

[fields."steps[].sim.kind"]
type = "enum"
values = ["gather", "craft", "make", "harvest", "build", "travel", "talk", "eat", "plant", "view"]
required = false
description = "The quest objective kind that ticks it (src/systems/quests/objectives.rs)."

[fields."steps[].sim.target"]
type = "string"
required = false
description = "What the event must name."

[fields."steps[].short"]
type = "bool"
required = false
description = "false leaves an explanatory step out of the Short view. Refused on a step with serious or lethal safety (gate short_hides_safety)."

[fields."steps[].no"]
type = "id"
required = false
description = "check only: where No goes, a problem id or a step id (gate no_target)."

[fields."steps[].wait"]
type = "object"
required = false
description = "wait only: the timer."

[fields."steps[].wait.min_s"]
type = "int"
required = true
description = "The least time, in seconds."

[fields."steps[].wait.max_s"]
type = "int"
required = false
description = "The most, for a range (12 to 24 hours of cooling)."

[fields."steps[].record"]
type = "object"
required = false
description = "measure only: the value to write down."

[fields."steps[].record.type"]
type = "enum"
values = ["text", "number"]
required = true
description = "What kind of value."

[fields."steps[].record.label"]
type = "string"
required = true
description = "What it is: 'Filter size'."

[fields."steps[].record.unit"]
type = "string"
required = false
description = "The unit it is written in, when it has one."

[fields."steps[].record.range"]
type = "object"
required = false
description = "The values that are normal, for a number."

[fields."steps[].record.range.min"]
type = "int"
required = false
description = "The lowest normal value."

[fields."steps[].record.range.max"]
type = "int"
required = false
description = "The highest normal value."

[fields."steps[].record.remember"]
type = "bool"
required = false
description = "Show last time's value next time ('Last time: 16 x 25 x 1')."

[fields."steps[].options"]
type = "array<object>"
required = false
description = "choose only: two or more options with different ids (gate kind_fields)."

[fields."steps[].options[].id"]
type = "id"
required = true
description = "Named by later steps' `if`."

[fields."steps[].options[].label"]
type = "string"
required = true
description = "What the person picks."

[fields."steps[].how_to"]
type = "id"
required = false
description = "call only: the how-to to do here."

[fields."steps[].page"]
type = "id"
required = false
description = "go only: a page id (src/gui/dispatch.rs page_id)."

[fields."steps[].section"]
type = "id"
required = false
description = "go only, with page settings: a Settings section (SettingsCategory, lower case)."

[fields."steps[].action"]
type = "id"
required = false
description = "action only: an admin action id."

[fields."steps[].command"]
type = "string"
required = false
description = "command only: the command, as typed."

[fields."steps[].shell"]
type = "enum"
values = ["bash", "powershell", "cmd"]
required = false
description = "command only: where it is typed."

[fields."steps[].ai_notes"]
type = "array<text>"
required = false
description = "Reserved for increment 6: wording only an AI following the procedure needs (the generated Claude Code skills)."

# ── The end ──

[fields.worked_if]
type = "array<string>"
required = false
description = "How to tell it worked, checked at the end."

[fields.problems]
type = "array<object>"
required = false
description = "What goes wrong: what you see, why, what to do. Search reads the signs, because people arrive with a symptom."

[fields."problems[].id"]
type = "id"
required = true
description = "Named by a check step's `no`."

[fields."problems[].sign"]
type = "string"
required = true
description = "What the person sees: 'The lid springs up when pressed.'"

[fields."problems[].why"]
type = "string"
required = false
description = "Why it happens."

[fields."problems[].fix"]
type = "string"
required = true
description = "What to do."

[fields."problems[].stop"]
type = "bool"
required = false
description = "true when the answer is to stop and get help; the page shows Get help."

[fields."problems[].cites"]
type = "array<id>"
required = false
description = "Keys of this how-to's sources behind the problem's facts (gate cite_unknown)."

# ── Who can help (increment 2 renders it) ──

[fields.help]
type = "object"
required = false
description = "Who could do it for you, or teach it, through the Market's service offerings (docs/design/how-to.md, 'Who can help')."

[fields."help.do"]
type = "array<id>"
required = false
description = "The offering `action` verbs that would do it for you (repair, maintain, install, instruct...)."

[fields."help.acts_on"]
type = "array<id>"
required = false
description = "data/items.csv ids a helper's offering acts on (gate item_unknown)."

[fields."help.teach"]
type = "bool"
required = false
description = "true when someone could teach it (offerings with action instruct)."

[fields."help.catalog"]
type = "array<string>"
required = false
description = "Single Help and Services catalog entries, once they have ids (increment 2)."

# ── Doing it again ──

[fields.repeat]
type = "object"
required = false
nullable = true
description = "The suggested interval. The person sets the real one (a repeat, increment 3)."

[fields."repeat.every_days"]
type = "int"
required = true
description = "Days between runs."

[fields."repeat.note"]
type = "string"
required = false
description = "When to do it more or less often."

# ── Making something (the game's recipe) ──

[fields.makes]
type = "object"
required = false
nullable = true
description = "For a how-to that makes something the game can make. In increment 1 it names a data/recipes.csv id (gate recipe_unknown); the transform's own fields below carry the recipe when recipes move into how-tos (increment 4)."

[fields."makes.recipe"]
type = "id"
required = true
description = "The recipe id. In increment 4 the how-to's id is its recipe's id."

[fields."makes.inputs"]
type = "array<object>"
required = false
description = "Increment 4: the game's inputs (recipes.csv `inputs`)."

[fields."makes.inputs[].item"]
type = "id"
required = true
description = "An item id."

[fields."makes.inputs[].count"]
type = "int"
required = true
description = "How many."

[fields."makes.outputs"]
type = "array<object>"
required = false
description = "Increment 4: the game's outputs (recipes.csv `outputs`)."

[fields."makes.outputs[].item"]
type = "id"
required = true
description = "An item id."

[fields."makes.outputs[].count"]
type = "int"
required = true
description = "How many."

[fields."makes.seconds"]
type = "int"
required = false
description = "Increment 4: the game's craft time (recipes.csv `craft_time_sec`)."

[fields."makes.station"]
type = "id"
required = false
description = "Increment 4: the station it needs (recipes.csv `station_required`)."

[fields."makes.skill"]
type = "id"
required = false
description = "Increment 4: the skill it needs (recipes.csv `skill_required`)."

[fields."makes.skill_level"]
type = "int"
required = false
description = "Increment 4: the level of that skill."

# ── Sources and review ──

[fields.sources]
type = "array<object>"
required = true
description = """
Where the facts come from. Facts are restated in our own words; copyrighted
text is never copied in (the registry's `use` rule). A source marked sourced or
verified must have at least one (gate review_status).
"""

[fields."sources[].key"]
type = "id"
required = true
description = "This how-to's own name for the source, named by steps' and problems' `cites`."

[fields."sources[].source"]
type = "string"
required = false
description = "An id in data/sources/registry.json, the one list of authorities (gate source_unknown). One of source or in_project."

[fields."sources[].in_project"]
type = "string"
required = false
description = "A path in this repository, for a fact about HumanityOS itself (gate in_project_missing)."

[fields."sources[].title"]
type = "string"
required = true
description = "The page's or document's own title, as it calls itself."

[fields."sources[].where"]
type = "string"
required = false
description = "Where exactly: the address of the page or file."

[fields."sources[].dated"]
type = "string"
required = true
description = "The source's own date (YYYY-MM-DD, YYYY-MM or YYYY), or the word undated when it carries none: stated, so it is a finding rather than an omission."

[fields."sources[].read"]
type = "date"
required = true
description = "The date we read it. The pair of dates is what lets a later reader see whether a source changed after we looked."

[fields."sources[].quote"]
type = "text"
required = false
description = "The words that carry the meaning, quoted exactly and short (a warning past 300 characters)."

[fields."sources[].note"]
type = "text"
required = false
description = "Anything a reader of this citation needs: how it was read, what it does not say, where two sources disagree."

[fields.review]
type = "object"
required = true
description = "Review is a field, not a comment: teaching data fails in ways code does not (memory project_teaching_data_needs_refutation)."

[fields."review.status"]
type = "enum"
values = ["absent", "stub", "sourced", "verified"]
required = true
description = """
The Curriculum's scale and meanings exactly. absent is for planned how-tos
only (data/how_to/planned.json), never a written file; stub: written, not
sourced; sourced: every claim cites; verified: sourced and independently
refuted-and-merged. Shown as "Checked <date>", "Sourced, not yet checked" or
"Not checked yet".
"""

[fields."review.hash"]
type = "string"
required = false
nullable = true
description = "BLAKE3 (hex) of the how-to's canonical CBOR without this review block: a review binds to the words it checked. If the words change the checker refuses a shipped file (gate review_hash_stale) and the page shows 'Changed since it was checked'. Required for verified (gate verified_without_hash)."

[fields."review.checked"]
type = "date"
required = false
nullable = true
description = "The date of the check the hash belongs to."

[fields."review.by"]
type = "string"
required = false
nullable = true
description = "What checked it: 'refutation pass', or a reviewer."

[fields."review.person"]
type = "date"
required = false
nullable = true
description = "The date a PERSON read it. A lethal how-to cannot be verified without one (gate lethal_without_person), the operator's 2026-09-16 Curriculum rule extended to how-tos (decision 3)."

[fields.written_by]
type = "enum"
values = ["ai", "person"]
required = true
description = "Shown on the page (the Accord: be open about AI)."

[fields.updated]
type = "date"
required = true
description = "The date the words last changed."

# ── data/how_to/categories.json ──

[category]
description = "One node of the tree. `categories` is the top level; `children` nest without a depth limit."

[category_fields.id]
type = "id"
required = true
description = "Unique across the whole tree. A top-level id is also the folder of its how-tos."

[category_fields.title]
type = "string"
required = true
description = "Its name on the page."

[category_fields.line]
type = "string"
required = true
description = "One line saying what is in it."

[category_fields.order]
type = "int"
required = false
description = "Its place among its siblings."

[category_fields.icon]
type = "id"
required = false
description = "A painter name of src/gui/widgets/icons.rs (paint_<name>), mapped by name on the website."

[category_fields.subjects]
type = "array<id>"
required = false
description = "Curriculum subject ids this branch practises."

[category_fields.help]
type = "array<id>"
required = false
description = "Help and Services category ids (data/external/catalog.json)."

[category_fields.audience]
type = "enum"
values = ["everyone", "server_owner", "developer"]
required = false
description = "developer: the branch shows only with Developer mode on."

[category_fields.children]
type = "array<object>"
required = false
description = "Its child nodes, the same shape."

# ── data/how_to/planned.json ──

[planned]
description = "How-tos named but not written (status absent), so the gaps are countable and shown dimmed in their category: a page that only shows what it has cannot tell you what it is missing (the Curriculum's principle)."

[planned_fields.id]
type = "id"
required = true
description = "The id the file will have. Unique among written and planned how-tos (gate duplicate_id)."

[planned_fields.title]
type = "string"
required = true
description = "As a how-to's title."

[planned_fields.summary]
type = "string"
required = true
description = "What it will teach."

[planned_fields.category]
type = "id"
required = true
description = "Where it will sit."

[planned_fields.audience]
type = "enum"
values = ["everyone", "server_owner", "developer"]
required = false
description = "As a how-to's audience."

# ── A run: one time a person does a how-to (not shipped data) ──
# Kept on the person's device only: %APPDATA%/HumanityOS/how_to/runs/<run>.json
# on the desktop (written to a .tmp and renamed), IndexedDB `humanity-how-to`
# on the website. Never sent anywhere. src/how_to/runs.rs is the model.

[run]
description = "One time a person does a how-to: when it started, which steps are done, what they wrote down, how it ended."

[run_fields.run]
type = "string"
description = "r-YYYYMMDD-HHMMSS-xxxx, unique."

[run_fields.how_to]
type = "id"
description = "The how-to's id."

[run_fields.hash]
type = "string"
description = "The how-to's hash when the run started; a run on a how-to that changed since says so."

[run_fields.reality]
type = "enum"
values = ["real", "sim"]
description = "A game run lives in the game save (increment 5)."

[run_fields.started]
type = "string"
description = "UTC time, YYYY-MM-DDTHH:MM:SSZ."

[run_fields.finished]
type = "string"
description = "UTC time it ended, or null."

[run_fields.outcome]
type = "enum"
values = ["worked", "did_not_work", "stopped"]
description = "How it ended, or null while running."

[run_fields.choices]
type = "map<string>"
description = "choose step id to option id."

[run_fields.steps]
type = "object"
description = "Step id to { done (time), value, answer (yes or no), went_to }. Keyed by id, so an edited, reordered or updated how-to keeps the ticks; a step that no longer exists shows as 'This step was removed since you started'."

[run_fields.waits]
type = "object"
description = "Step id to { ends (time) }: a timer runs while the app is closed."

[run_fields.notes]
type = "text"
description = "What the person wrote."

[run_fields.photos]
type = "array<string>"
description = "Reserved: file names in the run's folder (a later rung)."

[run_fields.task]
type = "string"
description = "Reserved: a Tasks id (increment 3)."

[run_fields.place]
type = "string"
description = "Reserved: the jurisdiction the run was done in (increment 7)."
