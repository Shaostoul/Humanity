# ---------------------------------------------------------------------------
# MISSING / FUTURE (deliberately unspecified, and why)
# ---------------------------------------------------------------------------

[missing_future]
service_taxonomy = """
NOT SPECIFIED: a taxonomy of SERVICES to match data/items.csv. Services are
grouped today by `category` plus the (action, item_ref) pair, which covers
work performed ON a thing (repair a bicycle, mill grain, install a panel) and
does not cover work performed on a person or a situation (counselling, legal
aid, childcare). Those group by category alone and are therefore coarser in
cross-provider search. Deliberate: inventing a global service taxonomy before
watching what real providers publish would be guesswork, and the (action,
item_ref) pair already carries the majority of homestead-relevant work. Revisit
once real service offerings exist to count."""
bulk_import_format = """
NOT HERE: the CSV or JSONL shape a provider uploads, its column mapping, and
the rejection report. That is increment 2 of the ladder. This schema is what
the importer validates AGAINST, which is why `[validation]` is written as an
ordered, implementable list rather than prose."""
orders_carts_reservations = """
DELIBERATELY ABSENT: no cart, no order, no reservation, no hold, no receipt.
Settlement is directory-only, so there is no transaction for the platform to
model. Adding any of them makes this a marketplace and drags in the regulatory
weight the design explicitly refuses to carry to launch."""
wallet_and_escrow = """
RESERVED, NOT SHIPPED: `settlement.mode` values "wallet" and "escrow", plus
the reserved payload keys in `[settlement_reserved_fields]`. Reserved in
writing so they need no schema migration and so nobody squats the names with a
different meaning. Wallet mode is blocked on the known web wallet token-send
bug; escrow mode is blocked on legal review."""
reviews_and_ratings = """
NOT IN THIS SCHEMA: a rating cannot live inside an object its subject signs.
Reviews will be separate signed objects referencing an offering or a provider,
weighted by the trust graph (src/relay/storage/issuer_trust.rs), and they are
worth little until there is some evidence an exchange happened, which
directory-only settlement does not produce. A real design problem, deferred
honestly rather than faked."""
moderation_and_delisting = """
NOT IN THIS SCHEMA: one server cannot edit another server's signed objects.
Delisting is a decision about what a server SURFACES, so it belongs in a local
blocklist plus, later, a signed moderation log other servers may choose to
honour (gap 4 in docs/design/market-directory.md). Without it the first scam
poisons trust in the whole directory, so this is the highest-value unbuilt
piece after verification."""
price_normalization = """
NOT SPECIFIED: comparing 24.99 USD against 22.50 EUR against 400 CR needs a
rate source, a staleness policy for the rates, and a display convention. The
Market can sort within one currency today and must not pretend to sort across
several."""
taxes_and_fees = """
NOT MODELLED: sales tax, VAT, deposits, and delivery surcharges. Prices are
quotes exactly as the provider states them. Modelling tax correctly is
per-jurisdiction work that only matters once money moves through us, which it
does not."""
inventory_sync_protocol = """
NOT SPECIFIED: push feeds, webhooks, or a pull endpoint for a large provider
to keep thousands of offerings current. Republish-and-touch (`[staleness]`)
works and is simple; a sync protocol is an optimisation to design after
somebody actually feels the pain."""
accessibility_attributes = """
KNOWN GAP: whether a physical location has step-free access, hearing loop,
accessible parking, or service-animal welcome. This genuinely belongs in the
location shape, it is a mission-relevant omission rather than a deliberate one,
and it is left out only because the vocabulary should be picked with people who
need it rather than guessed at here."""
variant_matrices = """
FLAT ON PURPOSE: `good.variants` is a list of stocked combinations, not a
size-by-colour matrix with generated permutations. A matrix invites a provider
to publish 400 rows for 12 real items. If a real catalogue needs one, generate
the flat list at import time."""
