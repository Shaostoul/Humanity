# humanity-ai-engine (docs/crates/humanity-ai-engine.md): the AI engine, `humanity-ai.exe`, the one
# separate program that will run every AI model the person chooses (docs/design/embeddable-ai.md,
# section 7; the runtime finding docs/reference/findings/2026-11-09-model-runtime.md). The app starts it
# only while an AI feature is in use and talks to it through its standard input and output in the
# messages of crates/humanity-ai-protocol/, one JSON object per line: no socket, no listener, no network.
#
# RUNG 1 (2026-11-09): a skeleton with no model and no runtime. `--fake` answers with scripted lines and
# timing, so every screen, fallback and notice is tested without any model (12.1); without `--fake` it
# says hello with no backends and refuses every model request in words. RUNG 2 (2026-11-09) adds
# llama.cpp behind the `llama` feature below (Granite 4.0 1B is the first model); rung 5 adds audio.cpp
# (Pocket TTS only), rung 8 tract.
#
# NOT A MEMBER OF THE APP'S WORKSPACE, on purpose (the root Cargo.toml lists it in `exclude`; this file
# has its own [workspace] table and its own Cargo.lock):
# - HumanityOS.exe must never depend on it (CLAUDE.md, "AI is optional, never required": the model
#   runtime is a separate download), and a crate outside the workspace cannot be pulled in by a stray
#   `--workspace` build or a feature unified across members;
# - the runtimes it will link need CMake and a C++ compiler (7.1: "it builds only through its own recipe
#   and CI job, never in `just verify`'s ordinary build");
# - so the app's Cargo.lock can never name llama.cpp, audio.cpp, tract or ONNX Runtime, which is what
#   tests/no_ai_in_app_lint.rs reads.
# Build it with `just ai-engine` (target/ai-engine/release/humanity-ai.exe); `just ai-engine test` runs
# its tests. The app's client tests build its debug copy themselves when it is missing.
[package]
name = "humanity-ai-engine"
# The engine's own version, not the app's: the app names the engine version it expects (src/ai, and the
# catalog from rung 2), and a new engine arrives only with an app release that names it (7.4).
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "humanity_ai_engine"
path = "src/lib.rs"

[[bin]]
name = "humanity-ai"
path = "src/main.rs"

[dependencies]
humanity-ai-protocol = { path = "../humanity-ai-protocol" }
serde_json = "1"

# RUNG 2 (2026-11-09): `llama` adds llama.cpp, the brains' runtime (7.1), CPU only in this rung.
# NOT a default feature, on purpose: the app's client tests (src/ai/client_tests.rs) build this crate's
# debug copy with plain `cargo build` for its `--fake` mode, and that build must never need CMake or a
# C++ compiler (rung 1's lesson). `just ai-engine` (build, package) and the second half of `just
# ai-engine test` turn it on; scripts/ai-engine.js finds the pinned llama.cpp source (llama-src/) and
# CMake for them.
[features]
default = []
llama = ["dep:cmake", "dep:cc"]

# Only the `llama` feature's build script uses these: CMake builds llama.cpp, cc compiles the engine's
# small C door into it (src/llama/shim.c). Pinned exactly so a rebuild of the same engine version
# compiles the same way (7.4). Neither ends up in the program.
[build-dependencies]
cmake = { version = "=0.1.58", optional = true }
cc = { version = "=1.11.1", optional = true }

# Its own workspace: see the top of this file.
[workspace]
