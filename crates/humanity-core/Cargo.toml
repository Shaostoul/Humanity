# humanity-core (docs/crates/humanity-core.md): the small leaves every other crate uses, the ECS, the
# data loading and hot reload, storage and the Sol model. The bottom of the stack: it uses no crate of
# ours. Cut out of the one crate in the crate split's rung 1 (2026-11-01, docs/design/crate-split.md).
[package]
name = "humanity-core"
version.workspace = true
edition.workspace = true
publish = false
# Names the repo root for the code, env!("HUMANITY_REPO_ROOT"); the one every crate under crates/ shares.
build = "../repo_root.rs"

[features]
# The same default as the root package, so `cargo test -p humanity-core` tests what the app builds.
default = ["native"]
# The desktop app's parts: the hot-reload watcher, the audio engine, the process memory reading, the
# keychain unlock, the Windows registry reader and the debug console's panel. The root's `native`
# turns it on; the server build (`--features relay --no-default-features`) leaves it off.
native = ["dep:notify", "dep:memory-stats", "dep:kira", "dep:egui", "dep:keyring", "dep:aes-gcm", "dep:pbkdf2", "dep:sha2", "dep:base64", "dep:getrandom", "dep:windows"]
wasm = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
# The test helpers other crates' tests use: test_temp, test_clock, test_log, the frame-cost store's
# reset and lock, and the fixtures named `fixtures` beside the tests they came from. A crate's
# #[cfg(test)] items are never compiled into another crate's tests, so a dependent turns this on in
# its [dev-dependencies] only; no product build carries it.
test-support = []

[dependencies]
log = { workspace = true }
glam = { workspace = true }
hecs = { workspace = true }
rapier3d = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
bytemuck = { workspace = true }
blake3 = { workspace = true }
notify = { workspace = true, optional = true }
memory-stats = { workspace = true, optional = true }
kira = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
# test_temp's own test of a database still open when its guard drops.
rusqlite = { workspace = true }
