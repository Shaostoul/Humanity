# humanity-terrain (docs/crates/humanity-terrain.md): planets as shapes and numbers: the surface and its
# heights, the level-of-detail patches and their meshes as plain data, the oceans and water, the plants'
# and trees' geometry, real map regions, asteroids and the celestial projection. It draws nothing (the
# renderer uploads what it builds) and uses only the core, so it compiles once and stays built. Cut out
# of the one crate in the crate split's rung 2 (2026-11-02, docs/design/crate-split.md).
[package]
name = "humanity-terrain"
version.workspace = true
edition.workspace = true
publish = false
# Names the repo root for the code, env!("HUMANITY_REPO_ROOT"); the one every crate under crates/ shares.
build = "../repo_root.rs"

[features]
# The same default as the root package, so `cargo test -p humanity-terrain` tests what the app builds.
default = ["native"]
# The desktop app's parts: the OpenStreetMap regions' 3D mesher (osm_region). The root's `native` turns
# it on; the server build (`--features relay --no-default-features`) leaves it off.
native = ["humanity-core/native"]
# The fixtures other crates' tests share (the Silverdale region fixtures, the far-tree test planet,
# the region-mask registry's test hold, the frame loop's sources). A crate's #[cfg(test)] items are
# never compiled into another crate's tests, so a dependent turns this on in its [dev-dependencies]
# only; no product build carries it.
test-support = []
# The offline map pack builder (map_build, whole-Earth maps rung 2): compiled for the
# `build_map_packs` example only (`just map-packs`), never into the app or the server.
map-build = []

[[example]]
name = "build_map_packs"
required-features = ["map-build"]

# How long a patch takes to build inside an installed map pack, by depth (whole-earth-maps.md 13,
# the rung between 2 and 3): a developer measurement on the shipped fixtures, never in the app.
[[example]]
name = "bench_map_patches"
required-features = ["test-support"]

[dependencies]
humanity-core = { path = "../humanity-core", default-features = false }
glam = { workspace = true }
log = { workspace = true }
noise = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
# Deflate for the whole-Earth map packs (map_pack, rung 2, 2026-11-09): every chunk is a zlib stream,
# and the offline builder (map_build) inflates the sources' own deflate tiles. Already in the build
# through image, png and the relay's backup stream: no new crate.
miniz_oxide = "0.8"

[dev-dependencies]
# The core's test helpers and fixtures (test_temp, dev_travel::fixtures).
humanity-core = { path = "../humanity-core", default-features = false, features = ["test-support"] }
