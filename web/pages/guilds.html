<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content="width=device-width, initial-scale=1.0">
  <title data-i18n="guilds.page_title">Guilds, HumanityOS</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
/* Colours this page uses that have no theme token. The dark value is exactly
   the page's look before the light theme reached its text (2026-10-20); the
   light one is the theme's own danger. */
:root { --pg-danger-ink: #c44; }
:root[data-theme="light"] { --pg-danger-ink: var(--danger); }
body { background: var(--bg); color: var(--text); min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }
#page-app {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px;
}

/* Header */
.guilds-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.guilds-header h1 { font-size: 1.4rem; margin: 0; }
.search-row {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: 200px;
  max-width: 400px;
}
.search-row input {
  flex: 1;
  padding: 6px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text);
  font-size: var(--text-sm);
}
.btn-primary {
  padding: 6px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
  font-size: var(--text-sm);
  white-space: nowrap;
}
.btn-primary:hover { background: var(--accent); color: #fff; }
.btn-danger {
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--pg-danger-ink);
  background: transparent;
  color: var(--pg-danger-ink);
  font-size: 12px;
}
.btn-danger:hover { background: #c44; color: #fff; }

/* Guild cards grid */
.guilds-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.guild-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.guild-card:hover { border-color: var(--accent); }
.guild-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.guild-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.guild-name { font-weight: 600; font-size: var(--text-base); }
.guild-desc {
  color: var(--text-muted);
  font-size: var(--text-sm);
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.guild-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-muted);
}

/* Detail view */
.guild-detail {
  display: none;
}
.guild-detail.open { display: block; }
.guild-detail-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.guild-detail-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: var(--text-sm);
  padding: 4px 8px;
  cursor: pointer;
  margin-bottom: 12px;
}
.back-btn:hover { text-decoration: underline; }
.member-list {
  list-style: none;
  padding: 0;
  margin: 12px 0;
}
.member-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: var(--text-sm);
}
.member-role {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 8px;
  background: var(--accent-dim);
  color: var(--accent);
}
.member-role.owner { background: #553300; color: #ffaa33; }
.member-role.officer { background: #333355; color: #8888ff; } /* theme-exempt: a solid badge, its colour and ink a pair that reads on either ground */

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  width: 400px;
  max-width: 90vw;
}
.modal h2 { margin: 0 0 16px; font-size: 1.1rem; }
.modal label {
  display: block;
  font-size: var(--text-sm);
  color: var(--text-muted);
  margin-bottom: 4px;
  margin-top: 10px;
}
.modal input, .modal textarea {
  width: 100%;
  padding: 6px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text);
  font-size: var(--text-sm);
  box-sizing: border-box;
}
.modal textarea { height: 60px; resize: vertical; }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}
.modal-actions button {
  padding: 6px 16px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
}

/* Invite section */
.invite-section {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-top: 12px;
}
.invite-code {
  font-family: monospace;
  font-size: 1.1rem;
  background: var(--bg-input);
  padding: 6px 12px;
  border-radius: var(--radius);
  user-select: all;
  display: inline-block;
  margin: 8px 0;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state h3 { color: var(--text); margin-bottom: 8px; }

@media (max-width: 600px) {
  .guilds-grid { grid-template-columns: 1fr; }
  .guilds-header { flex-direction: column; align-items: stretch; }
  .search-row { max-width: none; }
}
  </style>
</head>
<body>
<script src="/shared/i18n-en.js"></script>
<script src="/shared/i18n.js"></script>
<script src=/shared/shell.js data-active=guilds></script>
<script src="/shared/defaults.js"></script>
<script src="/shared/settings.js"></script>

<div id="page-app">
  <!-- Browse view -->
  <div id="browse-view">
    <div class="guilds-header">
      <h1 data-i18n="guilds.title">Guilds</h1>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search guilds..." data-i18n-placeholder="guilds.search_web" data-i18n-tip="guilds.search_web_hint" data-tip-desc="Type a word to show only the guilds whose name or description holds it.">
      </div>
      <button class="btn-primary" onclick="showCreateModal()" data-i18n="guilds.create_button" data-i18n-tip="guilds.create_button_hint" data-tip-desc="Opens a form to start a new guild of your own.">+ Create Guild</button>
    </div>
    <div id="guilds-grid" class="guilds-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none">
      <h3 data-i18n="guilds.none_found">No guilds found</h3>
      <p data-i18n="guilds.web_empty">Create the first guild or adjust your search.</p>
    </div>
  </div>

  <!-- Detail view -->
  <div id="detail-view" class="guild-detail">
    <button class="back-btn" onclick="showBrowse()" data-i18n-tip="guilds.back_hint" data-tip-desc="Goes back to the list of all guilds.">&larr; <span data-i18n="guilds.back">Back to Guilds</span></button>
    <div class="guild-detail-header">
      <div id="detail-icon" class="guild-detail-icon"></div>
      <div>
        <div id="detail-name" style="font-size:1.2rem;font-weight:600"></div>
        <div id="detail-meta" style="font-size:12px;color:var(--text-muted)"></div>
      </div>
    </div>
    <div id="detail-desc" style="color:var(--text-muted);margin-bottom:16px"></div>
    <div id="detail-actions" style="display:flex;gap:8px;margin-bottom:16px"></div>

    <h3 style="font-size:var(--text-sm);color:var(--text-muted);margin-bottom:8px" data-i18n="guilds.members">Members</h3>
    <ul id="detail-members" class="member-list"></ul>

    <div id="invite-section" class="invite-section" style="display:none">
      <h4 style="margin:0 0 8px;font-size:var(--text-sm)" data-i18n="guilds.invite_link">Invite Link</h4>
      <div id="invite-code" class="invite-code"></div>
      <button class="btn-primary" onclick="generateInvite()" style="margin-left:8px" data-i18n="guilds.generate_invite" data-i18n-tip="guilds.generate_invite_hint" data-tip-desc="Makes a new invite code for this guild. Give the code to someone so they can join.">Generate New</button>
    </div>
  </div>
</div>

<!-- Create Guild Modal -->
<div id="create-modal" class="modal-overlay" onclick="if(event.target===this)closeCreateModal()" data-i18n-tip="guilds.backdrop_hint" data-tip-desc="Clicking the dark area outside the form closes it without making a guild.">
  <div class="modal">
    <h2 data-i18n="guilds.create_title">Create Guild</h2>
    <label data-i18n="guilds.name">Name</label>
    <input type="text" id="guild-name" maxlength="100" placeholder="My Guild" data-i18n-placeholder="guilds.name_placeholder_web" data-i18n-tip="guilds.name_hint" data-tip-desc="Type the name people will see for your guild.">
    <label data-i18n="guilds.description">Description</label>
    <textarea id="guild-desc" maxlength="2000" placeholder="What is this guild about?" data-i18n-placeholder="guilds.desc_placeholder" data-i18n-tip="guilds.desc_hint" data-tip-desc="Tell people what your guild is about, so they can decide whether to join."></textarea>
    <label for="guild-color" data-i18n="guilds.color">Color</label>
    <input type="color" id="guild-color" value="#4488ff" style="width:48px;height:32px;padding:2px" data-i18n-tip="guilds.color_hint" data-tip-desc="Picks the color that marks your guild in the list.">
    <label data-i18n="guilds.icon_label">Icon (emoji)</label>
    <input type="text" id="guild-icon" maxlength="4" value="" placeholder="optional emoji" data-i18n-placeholder="guilds.icon_placeholder" data-i18n-tip="guilds.icon_hint" data-tip-desc="Type one emoji to stand for your guild. You can leave it empty.">
    <div class="modal-actions">
      <button onclick="closeCreateModal()" style="background:transparent;border:1px solid var(--border);color:var(--text)" data-i18n="common.cancel" data-i18n-tip="guilds.cancel_hint" data-tip-desc="Closes this form without making a guild.">Cancel</button>
      <button class="btn-primary" onclick="submitCreateGuild()" data-i18n="guilds.create" data-i18n-tip="guilds.create_submit_hint" data-tip-desc="Starts your new guild on this server, with you as its owner.">Create</button>
    </div>
  </div>
</div>

<script>
'use strict';

const API = window.location.origin;
let allGuilds = [];
let currentGuild = null;
let searchTimeout = null;

// Get user identity from localStorage (same pattern as chat)
function getMyKey() {
  try {
    const stored = localStorage.getItem('hos_identity');
    if (stored) {
      const parsed = JSON.parse(stored);
      return parsed.publicKeyHex || parsed.public_key || '';
    }
  } catch(e) {}
  return '';
}

// ---- API calls ----

async function fetchGuilds(search) {
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  params.set('limit', '100');
  const res = await fetch(`${API}/api/guilds?${params}`);
  if (!res.ok) return [];
  return await res.json();
}

async function fetchGuild(id) {
  const res = await fetch(`${API}/api/guilds/${id}`);
  if (!res.ok) return null;
  return await res.json();
}

async function fetchMembers(id) {
  const res = await fetch(`${API}/api/guilds/${id}/members?limit=200`);
  if (!res.ok) return [];
  return await res.json();
}

async function apiCreateGuild(data) {
  const res = await fetch(`${API}/api/guilds`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  return await res.json();
}

async function apiJoinGuild(guildId, publicKey, inviteCode) {
  const body = { public_key: publicKey };
  if (inviteCode) body.invite_code = inviteCode;
  const res = await fetch(`${API}/api/guilds/${guildId}/members`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.ok;
}

async function apiLeaveGuild(guildId, publicKey) {
  const res = await fetch(`${API}/api/guilds/${guildId}/leave`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ public_key: publicKey }),
  });
  return res.ok;
}

async function apiCreateInvite(guildId, createdBy) {
  const res = await fetch(`${API}/api/guilds/${guildId}/invite`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ created_by: createdBy }),
  });
  if (!res.ok) return null;
  return await res.json();
}

// ---- Rendering ----

function renderGuilds(guilds) {
  const grid = document.getElementById('guilds-grid');
  const empty = document.getElementById('empty-state');

  if (!guilds.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = guilds.map(g => `
    <div class="guild-card" role="button" tabindex="0" data-guild-id="${escHtml(g.id)}" onclick="showDetail(this.dataset.guildId)" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showDetail(this.dataset.guildId); }" data-i18n-tip="guilds.view_hint">
      <div class="guild-card-header">
        <div class="guild-icon" style="background:${guildColor(g.color)}22;color:${guildColor(g.color)}">
          ${escHtml(g.icon || g.name.charAt(0).toUpperCase())}
        </div>
        <div class="guild-name">${escHtml(g.name)}</div>
      </div>
      <div class="guild-desc">${escHtml(g.description || i18n.t('guilds.no_description'))}</div>
      <div class="guild-meta">
        <span>${i18n.tn('guilds.members_count', g.member_count || 0)}</span>
        <span>${i18n.t('guilds.created_on', { date: g.created_at ? g.created_at.split('T')[0] : i18n.t('guilds.created_recently') })}</span>
      </div>
    </div>
  `).join('');
  i18n.apply(grid);
}

async function showDetail(id) {
  const guild = await fetchGuild(id);
  if (!guild) return;
  currentGuild = guild;

  document.getElementById('browse-view').style.display = 'none';
  const detail = document.getElementById('detail-view');
  detail.classList.add('open');

  document.getElementById('detail-icon').textContent = guild.icon || guild.name.charAt(0).toUpperCase();
  document.getElementById('detail-icon').style.background = guildColor(guild.color) + '22';
  document.getElementById('detail-icon').style.color = guildColor(guild.color);
  document.getElementById('detail-name').textContent = guild.name;
  document.getElementById('detail-meta').textContent = i18n.tn('guilds.members_count', guild.member_count || 0);
  document.getElementById('detail-desc').textContent = guild.description || i18n.t('guilds.no_description_dot');

  // Actions
  const myKey = getMyKey();
  const actions = document.getElementById('detail-actions');
  let actionsHtml = '';

  const members = await fetchMembers(id);
  const isMember = members.some(m => m.public_key === myKey);
  const isOwner = guild.owner_key === myKey;

  if (myKey && !isMember) {
    actionsHtml += `<button class="btn-primary" onclick="joinCurrentGuild()" data-i18n-tip="guilds.join_hint">${i18n.t('guilds.join_guild')}</button>`;
  } else if (myKey && isMember && !isOwner) {
    actionsHtml += `<button class="btn-danger" onclick="leaveCurrentGuild()" data-i18n-tip="guilds.leave_hint">${i18n.t('guilds.leave')}</button>`;
  }
  if (isMember) {
    actionsHtml += `<button class="btn-primary" onclick="toggleInviteSection()" data-i18n-tip="guilds.invite_hint">${i18n.t('guilds.invite')}</button>`;
  }
  actions.innerHTML = actionsHtml;
  i18n.apply(actions);

  // Members list
  const memberList = document.getElementById('detail-members');
  memberList.innerHTML = members.map(m => `
    <li>
      <span>${escHtml(m.name || m.public_key.substring(0, 12) + '...')}</span>
      <span class="member-role ${/^[a-z_-]+$/.test(m.role || '') ? m.role : ''}">${escHtml(m.role || '')}</span>
    </li>
  `).join('');

  // Hide invite section by default
  document.getElementById('invite-section').style.display = 'none';
}

function showBrowse() {
  document.getElementById('browse-view').style.display = 'block';
  document.getElementById('detail-view').classList.remove('open');
  currentGuild = null;
  loadGuilds();
}

async function joinCurrentGuild() {
  if (!currentGuild) return;
  const myKey = getMyKey();
  if (!myKey) { alert(i18n.t('guilds.sign_in_first')); return; }
  if (await apiJoinGuild(currentGuild.id, myKey)) {
    showDetail(currentGuild.id);
  }
}

async function leaveCurrentGuild() {
  if (!currentGuild) return;
  const myKey = getMyKey();
  if (!myKey) return;
  if (await apiLeaveGuild(currentGuild.id, myKey)) {
    showBrowse();
  }
}

function toggleInviteSection() {
  const section = document.getElementById('invite-section');
  section.style.display = section.style.display === 'none' ? 'block' : 'none';
}

async function generateInvite() {
  if (!currentGuild) return;
  const myKey = getMyKey();
  if (!myKey) return;
  const result = await apiCreateInvite(currentGuild.id, myKey);
  if (result && result.code) {
    document.getElementById('invite-code').textContent = result.code;
  }
}

// ---- Create modal ----

function showCreateModal() {
  document.getElementById('create-modal').classList.add('open');
  document.getElementById('guild-name').value = '';
  document.getElementById('guild-desc').value = '';
  document.getElementById('guild-color').value = '#4488ff';
  document.getElementById('guild-icon').value = '';
  document.getElementById('guild-name').focus();
}

function closeCreateModal() {
  document.getElementById('create-modal').classList.remove('open');
}

async function submitCreateGuild() {
  const myKey = getMyKey();
  if (!myKey) { alert(i18n.t('guilds.sign_in_first')); return; }

  const name = document.getElementById('guild-name').value.trim();
  if (!name) { alert(i18n.t('guilds.name_required')); return; }

  const data = {
    name,
    description: document.getElementById('guild-desc').value.trim(),
    color: document.getElementById('guild-color').value,
    icon: document.getElementById('guild-icon').value.trim(),
    owner_key: myKey,
  };

  const result = await apiCreateGuild(data);
  if (result && result.id) {
    closeCreateModal();
    await loadGuilds();
    showDetail(result.id);
  } else {
    alert(i18n.t('guilds.create_failed'));
  }
}

// ---- Search ----

document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => loadGuilds(e.target.value), 300);
});

// ---- Init ----

async function loadGuilds(search) {
  allGuilds = await fetchGuilds(search);
  renderGuilds(allGuilds);
}

// Text into markup, escaped for element content AND attribute values (2026-10-23: the old
// helper left quotes alone, and a guild's icon, its id in an onclick and a member's role went
// into the page unescaped; all three come from what people type).
function escHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// A guild's colour, only when it is a plain #hex colour (it goes into a style).
function guildColor(c) {
  return /^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#4488ff';
}

loadGuilds();
</script>
</body>
</html>
