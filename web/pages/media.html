<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media, HumanityOS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/shared/theme.css">
  <!-- The Media page (docs/design/media-showcase.md, "Increment 2, exact"). Everything
       inside #media-root is built by /pages/media-app.js with createElement and
       textContent; its styles are /shared/media.css, theme tokens only. -->
  <link rel="stylesheet" href="/shared/media.css?v=1">
  <style>
    body { background: var(--bg); color: var(--text); line-height: var(--line-height); min-height: 100vh; padding-bottom: 60px; }
  </style>
</head>
<body>
<script src="/shared/events.js?v=1"></script>
<script src="/shared/shell.js"></script>
<script src="/shared/defaults.js"></script>
<script src="/shared/settings.js"></script>

<div id="media-root"></div>

<!-- Remove asks with a press-and-hold confirmation. -->
<script src="/shared/hold-confirm.js?v=1"></script>
<!-- The person's Dilithium identity, kept by Chat in this browser: `pq.js` installs
     pqDeriveIdentity, pqSignMessage and pqBlake3; `pq-relay-auth.js` installs
     getPqIdentity and getPqSignedAuth (every signed Media request goes through it). -->
<script src="/chat/pq.js?v=2"></script>
<script src="/shared/pq-relay-auth.js?v=2"></script>
<!-- The page's own signed-in connection: the upload token and the server's settings. -->
<script src="/shared/relay-session.js?v=1"></script>
<script src="/pages/media-app.js?v=1"></script>
<!-- The admins' Media section, shown on this page to admins (also on /admin). -->
<script src="/pages/media-admin.js?v=1"></script>
</body>
</html>
