    .pp h3 { font-size: var(--text-lg); margin: var(--space-lg) 0 var(--space-sm); }
    .pp p { margin: var(--space-md) 0; }
    .pp a { color: var(--accent); }
    .pp ul, .pp ol { padding-left: var(--space-2xl); }
    .pp li { margin: var(--space-xs) 0; }
    .pp code { background: var(--bg-secondary); padding: 2px 6px; border-radius: var(--radius-sm); font-size: 0.88em; }
    .pp table { border-collapse: collapse; width: 100%; margin: var(--space-md) 0; font-size: var(--text-sm); display: block; overflow-x: auto; }
    .pp th, .pp td { border: 1px solid var(--border); padding: var(--space-sm) var(--space-md); text-align: left; vertical-align: top; }
    .pp th { background: var(--bg-secondary); }
    .pp hr { border: 0; border-top: 1px solid var(--border); margin: var(--space-2xl) 0; }
    .pp .pp-note { color: var(--text-secondary); }
