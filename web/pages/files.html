<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files, HumanityOS</title>
  <!-- An item's own page, /files/<id>, is this file with the item's Open Graph tags written
       at the next line by the relay (src/relay/files_page.rs). Keep that line as it is. -->
  <!-- files:og -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/shared/theme.css">
  <!-- The Files page, called the Media page (at /media) until 2026-10-19
       (docs/design/files-showcase.md, "Increment 2, exact"). Everything
       inside #files-root is built by /pages/files-app.js with createElement and
       textContent; its styles are /shared/files.css, theme tokens only. -->
  <link rel="stylesheet" href="/shared/files.css?v=12">
  <!-- "How this page works" (2026-10-20, /shared/how-it-works.js): the toggle by the heading and its fold. -->
  <link rel="stylesheet" href="/shared/how-it-works.css?v=1">
  <!-- The HumanityOS folder place (2026-10-19): the data browser's own styles, scoped to its parts. -->
  <link rel="stylesheet" href="/shared/files-folder.css?v=2">
  <link rel="stylesheet" href="/shared/files-places.css?v=1">
  <!-- Each file's type, always shown just before its name (2026-10-17), and the tinted parts of
       Add to Files and an item's Edit, in the chat sidebar's colours, darker. -->
  <link rel="stylesheet" href="/shared/file-badge.css?v=1">
  <link rel="stylesheet" href="/shared/tint-section.css?v=1">
  <!-- Files dragged from the computer onto the page: the dimmed overlay saying what a drop will do (2026-10-17). -->
  <link rel="stylesheet" href="/shared/drop-overlay.css?v=2">
  <!-- The upload window (2026-10-17, /shared/upload-window.js): this page at /files?window=upload in a
       frame over the chat is its Add to Files alone, without the site's menu, footer and background.
       At /files/<id>?window=item (a Media card's Open in the chat) it is that item's own page alone,
       drawn as the frame's page rather than a dimmed dialog over it.
       Marked here, before anything is drawn, so the menu never shows in the frame. In the frame only
       the page and what its own parts put on the body show: the drop overlay, the press-and-hold
       confirmation Remove asks with (/shared/hold-confirm.js; hidden, its promise never settled and
       Remove did nothing), and the tooltip /shared/shell.js draws in place of every title. -->
  <script>
    (function () {
      var framed = false;
      try { framed = window.self !== window.top; } catch (e) { framed = true; }
      if (framed && /(?:^|[?&])window=(?:upload|item)(?:&|$)/.test(location.search.slice(1))) document.documentElement.setAttribute('data-files-window', '');
    })();
  </script>
  <style>
    body { background: var(--bg); color: var(--text); line-height: var(--line-height); min-height: 100vh; padding-bottom: 60px; }
    [data-files-window] body { min-height: 0; padding: 0; }
    [data-files-window] body > :not(#files-root):not(.hos-drop-overlay):not(.hold-confirm-overlay):not(#hos-rich-tooltip) { display: none !important; }
    /* The item window: the item and its details in two panes filling the frame (files.css .files-panes-window). */
    [data-files-window] #files-root { padding: var(--space-sm); max-width: none; }
  </style>
</head>
<body>
<script src="/shared/events.js?v=1"></script>
<script src="/shared/shell.js"></script>
<script src="/shared/defaults.js"></script>
<script src="/shared/settings.js"></script>
<!-- Which server this is (Media round 5, docs/design/media-round-5-plan.md 3.11): a strip under
     the top menu naming it, with Switch. After shell.js, which sets the menu's height it sits under. -->
<script src="/shared/server-strip.js?v=1"></script>

<div id="files-root"></div>

<!-- Remove asks with a press-and-hold confirmation. -->
<script src="/shared/hold-confirm.js?v=1"></script>
<!-- The person's Dilithium identity, kept by Chat in this browser: `pq.js` installs
     pqDeriveIdentity, pqSignMessage and pqBlake3; `pq-relay-auth.js` installs
     getPqIdentity and getPqSignedAuth (every signed Media request goes through it). -->
<script src="/chat/pq.js?v=2"></script>
<!-- The recovery-phrase guard for "Also post in chat" (2026-10-17), the chat's own: the word list
     the phrase is spelled with and the matcher (/shared/warnings.js); pq-relay-auth.js
     pqRecoveryPhraseIn derives the phrase for each check and drops it. -->
<script src="/chat/bip39-english.js?v=1"></script>
<script src="/shared/warnings.js?v=3"></script>
<script src="/shared/pq-relay-auth.js?v=4"></script>
<!-- The page's own signed-in connection: the upload token and the server's settings. -->
<script src="/shared/relay-session.js?v=2"></script>
<!-- Report on a Media tile: the words a report signs and the reasons' help (context `media`). -->
<script src="/shared/report.js?v=4"></script>
<!-- Every file is cleaned on this device before it goes up (2026-10-11, docs/design/files-showcase.md,
     part 1): where it was taken and which camera took it are removed, unless the person turns off
     "Remove location and camera details". upload-clean.js after strip-metadata.js. -->
<script src="/shared/strip-metadata.js?v=1"></script>
<script src="/shared/upload-clean.js?v=1"></script>
<!-- Add to Files's resumable upload (pieces, Pause and Resume, carrying on after a drop); since
     round 5 it also attaches an upload to an item instead of publishing it. -->
<script src="/pages/files-upload.js?v=4"></script>
<!-- An item's own page and its Edit form (round 5, lane 2A): blake3.js hashes the edit's text,
     which its signature names; files-edit.js before files-item.js, both before files-app.js. -->
<script src="/shared/blake3.js?v=2"></script>
<!-- What kind of file each one is (2026-10-17): every file's type as a badge before its name, and under it
     a word when it deserves one (a program, a script, an archive, a Blender file). Reads
     /data/safety/file_risks.json, the list the desktop app reads too; before files-edit.js, which draws
     the badges for files-item.js and files-app.js. -->
<script src="/shared/file-risk.js?v=2"></script>
<script src="/pages/files-edit.js?v=5"></script>
<!-- "Report a copyright problem" (2026-10-13): the form anyone may send, signed in or not, and the
     admins' view of the reports; before files-item.js and files-app.js, which use it. -->
<script src="/pages/files-takedown.js?v=1"></script>
<!-- The 3D model viewer (2026-10-16, docs/design/model-viewer.md): View in 3D beside a .glb or .stl
     file's Download on an item's page, drawn with WebGL 2, no outside library; before files-item.js. -->
<script src="/shared/model-view.js?v=1"></script>
<!-- The protected setup (2026-10-16): what it leaves out of this page, the desktop's rule (a person's
     pictures and files where its pictures rule is on, a labelled item); reach.js before protected.js. -->
<script src="/shared/reach.js?v=4"></script>
<script src="/shared/protected.js?v=4"></script>
<!-- The three panes (2026-10-19, the desktop's files/panes.rs): which way they go, their split kept in
     this browser, and the handles between them; and a sound's view in the middle pane (Play here, then
     its waveform drawn from the decoded file, the spectrum while it plays). Before files-item.js. -->
<script src="/pages/files-panes.js?v=1"></script>
<script src="/pages/files-sound.js?v=1"></script>
<script src="/pages/files-item.js?v=8"></script>
<!-- Files dragged from the computer onto the page (2026-10-17): the desktop's words while they are
     over it ("Drop to upload to Files", "Drop to add to <the item>" with its Edit open) and its drop.
     Before files-app.js, which puts it on the page. upload-window.js: this page as the upload window
     over the chat (/files?window=upload in a frame), taking the files dropped there. -->
<script src="/shared/drop-overlay.js?v=2"></script>
<script src="/shared/upload-window.js?v=4"></script>
<!-- Add to Files (the form, its uploads, publishing and "Also post in chat"), in its own file since
     2026-10-17; files-app.js makes it, so it loads first. -->
<script src="/pages/files-add.js?v=3"></script>
<!-- The places (2026-10-19): Shared on <server> is this page's own list; Shared files is the Shared
     Files page that was (its Upload a file, shared-files-upload.js, before files-shared.js); the
     HumanityOS folder is the data browser that was at /files (markdown.js draws its .md files). All
     before files-app.js, which shows them. -->
<script src="/shared/markdown.js"></script>
<script src="/pages/shared-files-upload.js?v=2"></script>
<script src="/pages/files-shared.js?v=1"></script>
<script src="/pages/files-folder.js?v=3"></script>
<script src="/pages/files-places.js?v=3"></script>
<!-- "How this page works" (2026-10-20): the toggle beside the heading and its fold; before files-app.js. -->
<script src="/shared/how-it-works.js?v=1"></script>
<script src="/pages/files-app.js?v=18"></script>
<!-- The admins' section (Files page settings): this page's Admin tab, for admins (/files#admin; /admin points here). -->
<script src="/pages/files-admin.js?v=3"></script>
</body>
</html>
