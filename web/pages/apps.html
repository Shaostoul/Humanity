<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width,initial-scale=1.0>
  <title>Apps, HumanityOS</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <!-- The web mirror of the desktop app's Apps page (src/gui/pages/apps.rs and apps/, 2026-10-19):
       six parts, each under a band in its colour and its name, one toolbar, short tiles, and the
       details at the right (under the parts on a phone). Every colour is a theme token from
       /shared/theme.css (generated from data/gui/theme.ron), mixed with color-mix: the bands are
       the app's tint_section colours (red, green and blue the chat sidebar's, with the nav's
       group colours for their edges; cyan, magenta and yellow the section tokens). The one
       computed colour is a plain cover's hue, worked out from its seed in apps-app.js exactly as
       the app's widgets::swatch_color does (55% saturation, 42% lightness). -->
  <style>
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    #page-app { flex:1; padding:var(--space-xl) var(--space-2xl); max-width:1560px; width:100%; margin:0 auto; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* The head: the title and the page's line, the app's draw_head. */
    .apps-head { margin-bottom:var(--space-md); max-width:110ch; }
    .apps-head h1 { font-size:var(--text-2xl); font-weight:700; margin-bottom:var(--space-xs); }
    .apps-head p { font-size:var(--text-sm); line-height:1.5; color:var(--text-secondary); }

    /* The parts and the details beside them. */
    #apps-app { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--space-xl); align-items:start; }
    #apps-app.has-details { grid-template-columns:minmax(0,1fr) minmax(300px,440px); }
    .apps-main { min-width:0; container-type:inline-size; container-name:shelf; }

    /* The toolbar: search, Sort, Show; then a chip per part (the app's library::toolbar). */
    .apps-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-sm) var(--space-md); margin-bottom:var(--space-sm); }
    .apps-search { width:min(100%,280px); padding:5px 12px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font:inherit; font-size:var(--text-sm); }
    .apps-search:focus { outline:none; border-color:var(--accent); }
    .apps-search::placeholder { color:var(--text-muted); }
    .apps-label { font-size:var(--text-sm); color:var(--text-secondary); }
    .apps-label + .apps-pills { margin-left:calc(-1 * var(--space-sm)); }
    .apps-pills { display:flex; flex-wrap:wrap; gap:var(--space-xs); }
    .apps-chips { margin-bottom:var(--space-xs); }
    .apps-pill, .apps-chip { background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--pill-radius); padding:1px 10px; font:inherit; font-size:var(--text-sm); line-height:1.6; color:var(--text-secondary); cursor:pointer; }
    .apps-pill:hover, .apps-chip:hover { border-color:var(--accent-hover); color:var(--text); }
    .apps-pill[aria-pressed="true"], .apps-chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--text-on-accent); }
    /* A part's chip: edged in its colour; pressed, filled in it (the app's chip()). */
    .apps-chip[class*="apps-tint-"] { border-color:color-mix(in srgb,var(--band-edge) 60%,transparent); }
    .apps-chip[class*="apps-tint-"][aria-pressed="true"] { background:var(--band-fill); border-color:var(--band-edge); color:var(--text-strong); }
    .apps-pill:focus-visible, .apps-chip:focus-visible, .app-open:focus-visible, .app-btn:focus-visible, .app-desktop-only:focus-visible, .app-close:focus-visible, .app-row-name:focus-visible, .apps-sort:focus-visible, .apps-why:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    /* The six colours: a band's fill and its edge (widgets/tint_section.rs color and edge). */
    .apps-tint-red     { --band-fill:var(--dm-bg);              --band-edge:var(--nav-red); }
    .apps-tint-green   { --band-fill:var(--group-bg);           --band-edge:var(--nav-green); }
    .apps-tint-blue    { --band-fill:var(--server-bg);          --band-edge:var(--nav-blue); }
    .apps-tint-cyan    { --band-fill:var(--section-cyan-bg);    --band-edge:var(--section-cyan); }
    .apps-tint-magenta { --band-fill:var(--section-magenta-bg); --band-edge:var(--section-magenta); }
    .apps-tint-yellow  { --band-fill:var(--section-yellow-bg);  --band-edge:var(--section-yellow); }

    /* A part: its band (its name and how many, never the colour alone), then what it holds and
       its lines (the app's library::band). */
    .apps-part { margin-top:var(--space-md); }
    .apps-band { display:flex; align-items:baseline; gap:var(--space-sm); margin:0 0 var(--space-sm); padding:var(--space-xs) var(--space-md); background:var(--band-fill); border:1px solid var(--band-edge); border-radius:var(--radius); color:var(--text-strong); font-size:var(--text-xl); font-weight:700; line-height:1.3; }
    .apps-band-count { font-size:var(--text-base); font-weight:400; color:var(--text-secondary); }
    .apps-cats { margin-bottom:var(--space-sm); }
    .apps-line { font-size:var(--text-sm); line-height:1.5; color:var(--text-secondary); margin:var(--space-xs) 0 0; max-width:130ch; }
    .apps-line.apps-safety { color:var(--text); }
    .apps-line.apps-muted { color:var(--text-muted); }
    .apps-line.apps-desktop { padding:var(--space-xs) var(--space-md); background:var(--bg-secondary); border-left:3px solid var(--accent); border-radius:var(--radius-sm); }
    .apps-line.apps-desktop a { font-weight:600; white-space:nowrap; }
    .apps-why { display:inline-block; margin-left:var(--space-sm); padding:0 var(--space-sm); border:1px solid var(--text-muted); border-radius:var(--radius-sm); background:var(--bg-tertiary); color:var(--text); font-size:var(--text-xs); line-height:1.6; }
    .apps-why:hover { border-color:var(--accent-hover); color:var(--text-strong); }

    /* The Grid: as many tiles to a row as fit at 168px or wider, stretched to fill (shelf::grid). */
    .apps-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:var(--space-sm); margin-bottom:var(--space-xs); }
    .apps-group { display:flex; align-items:center; gap:var(--space-sm); font-size:var(--text-base); font-weight:700; margin:var(--space-sm) 0 var(--space-xs); }
    .apps-group-count { font-size:var(--text-sm); font-weight:400; color:var(--text-muted); }

    /* A tile is short (the app's, 2026-10-19: "The titles are stated twice, we don't need that"):
       its name once, on the plain cover; one line; a small button with one fact at its right. */
    .app-tile { display:flex; flex-direction:column; gap:2px; min-width:0; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:3px; }
    .app-tile:hover { border-color:var(--accent-hover); }
    .app-tile.selected { border-color:var(--accent); }
    .app-open { display:block; width:100%; padding:0; background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer; border-radius:var(--radius); }
    .app-meta, .app-fact { display:block; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:var(--text-sm); line-height:1.45; }
    .app-meta { color:var(--text-muted); }
    .app-row { display:flex; align-items:center; justify-content:space-between; gap:var(--space-sm); min-height:1.6rem; }
    .app-fact { color:var(--text-secondary); text-align:right; }

    /* A plain cover (cover_tile::paint_cover): the card colour tinted 34% toward its hue, a faint
       wash over its top half, its first letter (or its page's icon, for one of HumanityOS's own
       tools) faint at the right, and a darker band along the bottom holding the name. */
    .app-cover, .app-banner { --app-tint:hsl(var(--app-hue,210) 55% 42%); position:relative; display:block; overflow:hidden; container-type:inline-size; border:1px solid var(--border); background:linear-gradient(color-mix(in srgb,var(--text) 3.5%,transparent),color-mix(in srgb,var(--text) 3.5%,transparent)) top/100% 50% no-repeat, color-mix(in srgb,var(--bg-tertiary) 66%,var(--app-tint)); }
    .app-cover { aspect-ratio:460/215; border-radius:var(--radius); }
    .app-banner { aspect-ratio:3.1; min-height:80px; border-radius:var(--radius-lg); }
    .app-cover-letter { position:absolute; right:3.7cqw; top:50%; transform:translateY(-50%); font-size:44cqw; line-height:1; color:color-mix(in srgb,var(--text) 9%,transparent); pointer-events:none; }
    .app-banner .app-cover-letter { font-size:31cqw; right:2.6cqw; }
    /* A tool's page icon at the cover's top right, a third of its height (library::paint_tool_cover). */
    .app-cover-icon { position:absolute; top:4.2cqw; right:4.2cqw; width:15.9cqw; height:15.9cqw; background:color-mix(in srgb,var(--text-strong) 85%,transparent); -webkit-mask:var(--app-icon) center/contain no-repeat; mask:var(--app-icon) center/contain no-repeat; pointer-events:none; }
    .app-banner .app-cover-icon { top:2.9cqw; right:2.9cqw; width:11cqw; height:11cqw; }
    .app-cover-band { position:absolute; left:0; right:0; bottom:0; margin:0; padding:var(--space-xs) var(--space-sm); background:color-mix(in srgb,var(--bg-card) 60%,transparent); color:var(--text-strong); font-size:var(--text-base); font-weight:400; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
    .app-banner .app-cover-band { font-size:var(--text-2xl); padding:var(--space-sm) var(--space-md); }
    .app-dot { flex:none; display:inline-block; width:0.6em; height:0.6em; border-radius:50%; background:color-mix(in srgb,var(--text-secondary) 30%,hsl(var(--app-hue,210) 55% 42%)); }

    /* The buttons: the app's secondary button (Download, Open website, the details' links) and
       its primary one (a tool's Open), small on a tile, medium in a row, large in the details. */
    .app-btn { display:inline-block; background:var(--bg-tertiary); border:1px solid var(--text-muted); border-radius:var(--radius); color:var(--text); text-decoration:none; white-space:nowrap; }
    .app-btn:hover { border-color:var(--accent-hover); color:var(--text-strong); }
    .app-btn.primary { background:var(--accent); border-color:var(--accent); color:var(--text-on-accent); }
    .app-btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); color:var(--text-on-accent); }
    .app-btn.small { font-size:var(--text-sm); padding:0 8px; line-height:1.6; }
    .app-btn.medium { font-size:var(--text-base); padding:2px 10px; }
    .app-btn.large { font-size:var(--text-base); padding:4px 16px; font-weight:600; }
    .app-desktop-only { font-size:var(--text-sm); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .app-desktop-only:hover { color:var(--accent-hover); }

    /* The List (shelf::list_headings and list_row): striped rows, the chosen one in the accent. */
    .apps-table-wrap { overflow-x:auto; }
    .apps-table { width:100%; border-collapse:separate; border-spacing:0; }
    .apps-table th { text-align:left; font-size:var(--text-sm); font-weight:400; color:var(--text-muted); padding:var(--space-xs) var(--space-sm); border-bottom:1px solid var(--border); white-space:nowrap; }
    .apps-table td { padding:var(--space-xs) var(--space-sm); font-size:var(--text-sm); color:var(--text-secondary); vertical-align:middle; }
    .apps-table td.col-cat { color:var(--text-muted); }
    .apps-table tbody tr:nth-child(even) td { background:color-mix(in srgb,var(--text) 4%,transparent); }
    .apps-table tbody tr:hover td { background:color-mix(in srgb,var(--text) 7%,transparent); }
    .apps-table tbody tr.selected td { background:color-mix(in srgb,var(--accent) 16%,transparent); }
    .apps-table td:first-child { border-radius:var(--radius) 0 0 var(--radius); }
    .apps-table td:last-child { border-radius:0 var(--radius) var(--radius) 0; }
    .apps-table .col-act { width:8.5rem; }
    .apps-sort, .app-row-name { background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left; }
    .apps-sort.on { color:var(--accent); }
    .app-row-name { font-size:var(--text-base); font-weight:700; color:var(--text); }
    .app-row-name:hover { color:var(--accent-hover); }
    /* The columns give way when the room does: Size first, then Runs on, then Licence, a help
       service's Website, Category last (the app's columns_for). */
    @container shelf (max-width:920px) { .apps-table .col-size { display:none; } }
    @container shelf (max-width:820px) { .apps-table .col-plat { display:none; } }
    @container shelf (max-width:660px) { .apps-table .col-lic, .apps-table .col-web { display:none; } }
    @container shelf (max-width:540px) { .apps-table .col-cat, .apps-table .col-line { display:none; } }

    /* The details (shelf::details_panel), kept in view under the site's menu while the parts
       scroll (shell.js sets --hos-nav-h to the menu's height). */
    .apps-details { position:sticky; top:calc(var(--hos-nav-h, 0px) + var(--space-md)); max-height:calc(100vh - var(--hos-nav-h, 0px) - 2 * var(--space-md)); overflow-y:auto; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-lg); }
    .apps-details[hidden] { display:none; }
    /* Moved to (the details on a phone, a tile when the details close) clear of the menu. */
    .apps-details, .app-tile, .apps-table tr { scroll-margin-top:calc(var(--hos-nav-h, 0px) + var(--space-md)); }
    .apps-details:focus { outline:none; }
    .apps-details:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .app-detail-cat { display:flex; align-items:center; gap:var(--space-sm); margin:var(--space-sm) 0; font-size:var(--text-sm); color:var(--text-secondary); }
    .app-detail-cat-name { flex:1; min-width:0; }
    .app-close { background:none; border:0; color:var(--text-secondary); font:inherit; font-size:var(--text-sm); cursor:pointer; padding:2px 6px; border-radius:var(--radius-sm); }
    .app-close:hover { color:var(--text); background:var(--bg-hover); }
    .app-links { display:flex; flex-wrap:wrap; gap:var(--space-sm); margin-bottom:var(--space-sm); }
    .app-note { font-size:var(--text-sm); color:var(--text-secondary); line-height:1.5; margin-bottom:var(--space-sm); }
    .app-desc { font-size:var(--text-base); line-height:1.5; margin:var(--space-sm) 0; }
    .app-section { font-size:var(--text-xl); font-weight:400; margin-top:var(--space-md); padding-bottom:var(--space-xs); border-bottom:1px solid var(--border); margin-bottom:var(--space-sm); }
    .app-facts { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:var(--space-xs) var(--space-md); font-size:var(--text-sm); }
    .app-facts dt { color:var(--text-muted); }
    .app-facts dd { color:var(--text); overflow-wrap:anywhere; }
    .app-comes-from { font-size:var(--text-sm); color:var(--text-muted); line-height:1.5; margin-top:var(--space-md); }

    /* A phone, or any narrow window: one column, the details under the parts. */
    @media (max-width:900px) {
      #apps-app.has-details { grid-template-columns:minmax(0,1fr); }
      .apps-details { position:static; max-height:none; }
    }
    @media (max-width:600px) {
      #page-app { padding:var(--space-lg) 16px; }
      .apps-search { width:100%; }
      .apps-grid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
    }
  </style>
</head>
<body>
<script src="/shared/events.js?v=1"></script>
<script src=/shared/shell.js data-active=apps></script>
<script src="/shared/defaults.js"></script>
<script src="/shared/settings.js"></script>
<p class="page-hint">HumanityOS's own tools, free programs from their makers, and real-world help, in one place.</p>

<div id="page-app">
  <!-- The app's head (src/gui/pages/apps.rs draw_head): the title and the page's line. Its
       Refresh looks again at what is installed on the computer, which a web page cannot see. -->
  <header class="apps-head">
    <h1>Apps</h1>
    <p class="apps-intro">Your games, HumanityOS's own tools, other programs, and real-world help, in one place.</p>
  </header>
  <div id="apps-app">
    <noscript><p class="apps-line">This page lists HumanityOS's own tools, the free programs and the help services with JavaScript. The same lists are in the desktop app's Apps page.</p></noscript>
  </div>
</div>

<script src="/pages/apps-app.js?v=1"></script>
</body>
</html>
