# Installed as /etc/systemd/system/humanity-relay.service.d/time-sync.conf by
# scripts/install-server-files.sh (scripts/server-files.txt, every server), so the relay's unit
# gets it without anyone editing the unit by hand (signed requests round 3, C6, 2026-11-21).
#
# The relay refuses a signed request made before its own start (src/relay/signed_request.rs, D6:
# its memory of used signatures starts empty at every start). A relay that started on a clock
# still wrong at boot (before NTP set it) recorded a wrong start and refused every request until
# the clock caught up. So it starts after time-sync.target, which waits for a real sync when
# systemd-time-wait-sync.service is enabled (scripts/provision-vps.sh enables it with a 90-second
# limit, so a box without network time still starts the relay). Takes effect at the next restart
# after systemctl daemon-reload, which the installer runs.
[Unit]
After=time-sync.target
Wants=time-sync.target
