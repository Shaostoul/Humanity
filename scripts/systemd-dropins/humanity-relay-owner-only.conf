# Installed as /etc/systemd/system/humanity-relay.service.d/owner-only.conf by
# scripts/install-server-files.sh (scripts/server-files.txt, every server), so the relay's unit
# gets it without anyone editing the unit by hand (BUG-285, 2026-11-07).
#
# Every file and folder the relay makes is readable by its own account alone: the database, its
# write-ahead log and shared memory, its backups, its keys, the uploads. Until 2026-11-07 nothing
# set a umask and SQLite made relay.db 0644, readable by every account on the box (www-data, the
# Forgejo service). The relay also tightens what is already there at every start
# (src/relay/owner_only.rs), and this takes effect at the relay's next restart.
#
# Safe: nginx proxies /uploads/ to the relay and serves only /var/www; the backup timer, the disk
# guard, the watchdog, the deploy and the operator's backup pull all run as root.
[Service]
UMask=0077
