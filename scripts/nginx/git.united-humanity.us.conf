# git.united-humanity.us: Forgejo, the public pull mirror of GitHub.
#
# Installed on the VPS as /etc/nginx/sites-available/git.united-humanity.us (linked from
# sites-enabled). This copy is the source of truth; see docs/admin/forgejo-setup.md. After
# editing: copy it there, `nginx -t`, `systemctl reload nginx`.
#
# SOURCE ARCHIVES (BUG-169, 2026-10-05). Every commit page offers its code as a .zip, .tar.gz
# or .bundle, which Forgejo builds on disk the first time it is asked for: about 0.5 GB each
# for this repository. A crawler that ignored robots.txt (Forgejo's default one already asks
# crawlers to skip archives) asked for enough of them to fill the disk in a few hours. So
# archives are limited here, for everyone together: one a minute, with a burst of five, and
# anything past that is told 429 (too many requests, try later). Browsing and cloning are not
# limited. Forgejo deletes each archive ten minutes after building it (app.ini,
# [cron.archive_cleanup]), so the cache stays around ten archives at the worst.
limit_req_zone $server_name zone=git_archives:1m rate=1r/m;

server {
    listen 80;
    listen [::]:80;
    server_name git.united-humanity.us;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name git.united-humanity.us;
    ssl_certificate /etc/letsencrypt/live/git.united-humanity.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.united-humanity.us/privkey.pem;
    client_max_body_size 1024m;

    # /<owner>/<repo>/archive/<ref>.<zip|tar.gz|bundle>: see the note at the top.
    location ~ ^/[^/]+/[^/]+/archive/ {
        limit_req zone=git_archives burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LIVE since 2026-09-29, after the admin account was made through an SSH
    # tunnel with the site held at 503 (INSTALL_LOCK is now true).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
