name: Uptime (off-box health check)

# THE OFF-BOX MONITOR. Every monitor we had ran ON the VPS, so when the box was
# null-routed on 2026-08-07 nothing noticed for ~12 hours - the watchdog can't
# report a box that can't reach the internet. This job runs on GitHub's
# infrastructure, so it sees the server exactly as a visitor does.
#
# ALERTING: a failed scheduled workflow emails the repo owner by default
# (GitHub Settings > Notifications > Actions). No third-party account, no
# secrets, no cost - scheduled workflows on public repos are free.
#
# CAVEATS, stated honestly: GitHub's cron is best-effort and can be delayed by
# several minutes under load, and scheduled workflows are disabled after 60
# days with no repo activity. So this is a good SAFETY NET, not a tight SLA
# monitor. If sub-minute detection ever matters, add a dedicated uptime service
# alongside it - this does not replace that, it removes the excuse for having
# nothing.

on:
  schedule:
    # Every 15 minutes. Finer than this is pointless given cron jitter.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    name: Probe united-humanity.us
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The site answers
        run: |
          set -euo pipefail
          # Retry a few times before crying wolf: a single failed request can be
          # transient network weather between GitHub and the host, and a false
          # alarm every few days trains you to ignore the real one.
          for attempt in 1 2 3; do
            code=$(curl -o /tmp/body -sS -m 20 -w '%{http_code}' https://united-humanity.us/ || echo 000)
            [ "$code" = "200" ] && { echo "site OK (HTTP $code)"; exit 0; }
            echo "attempt $attempt: HTTP $code"
            sleep 20
          done
          echo "::error::united-humanity.us did not return 200 after 3 attempts (last: HTTP $code)"
          exit 1

      - name: The relay answers /health with real data
        run: |
          set -euo pipefail
          # A 200 from nginx only proves the WEB SERVER lives. /health proves the
          # RELAY behind it is alive - the 2026-08 outage would have been caught
          # by either, but a dead relay behind a live nginx is the quieter, more
          # likely failure and needs its own check.
          for attempt in 1 2 3; do
            if curl -fsS -m 20 https://united-humanity.us/health -o /tmp/health; then
              cat /tmp/health
              # Guard against a health endpoint that answers but is lying: it
              # must actually say ok.
              grep -q '"status":"ok"' /tmp/health && { echo "relay OK"; exit 0; }
              echo "::error::/health responded but did not report status ok"
              exit 1
            fi
            echo "attempt $attempt: /health unreachable"
            sleep 20
          done
          echo "::error::relay /health unreachable after 3 attempts"
          exit 1

      - name: The desktop update path is alive (warns, never fails)
        run: |
          set -euo pipefail
          # A THIRD kind of quiet outage, same family as the two above: the
          # v0.421+ updater only offers a release that carries
          # release-manifest.json + its .sig.json, and signing is a manual
          # operator step (`just sign-release`, needs the passphrase). Skip it
          # and every desktop client is stranded on its current version with no
          # error message anywhere. On 2026-09-06 the newest signed release was
          # v0.1294.1 while the latest was v0.1294.3.
          #
          # This WARNS rather than failing. The job runs every 15 minutes and a
          # failure emails the owner; an unsigned release can legitimately sit
          # for hours until the operator is at the machine with the key, and
          # emailing every 15 minutes about it is how you teach someone to
          # ignore this workflow (see this file's own note on false alarms).
          # `just brief` shows the same verdict at the top of every session.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          if ! curl -fsS -m 20 -H 'Accept: application/vnd.github+json' "$api" -o /tmp/rel; then
            echo "could not reach the releases API; skipping (not an outage of ours)"
            exit 0
          fi
          tag=$(grep -o '"tag_name": *"[^"]*"' /tmp/rel | head -1 | cut -d'"' -f4)
          if grep -q '"name": *"release-manifest.json.sig.json"' /tmp/rel; then
            echo "desktop update path OK: $tag is signed"
          else
            echo "::warning::Latest release $tag is UNSIGNED, so the desktop updater offers nothing to any v0.421+ client. Fix (operator only): just sign-release $tag"
            echo "### Desktop update path is dead" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Latest release \`$tag\` has no \`release-manifest.json.sig.json\` asset." >> "$GITHUB_STEP_SUMMARY"
            echo "Every v0.421+ desktop client is stranded with no update and no error." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Fix (operator only, needs the passphrase):" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "export HUMANITY_SIGNING_PASSPHRASE=... && just sign-release $tag" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: TLS certificate is not about to expire
        run: |
          set -euo pipefail
          # The cert renewal was armed to FAIL until 2026-08-12 (standalone
          # renewal needs port 80, nginx holds it). Renewal is fixed and hooked,
          # but a monitor that only checks "is it up" would not notice renewal
          # quietly breaking again until the day the site goes dark. Let's
          # Encrypt renews at 30 days remaining, so 14 is a real alarm.
          end=$(echo | openssl s_client -servername united-humanity.us \
                -connect united-humanity.us:443 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          end_s=$(date -d "$end" +%s)
          days=$(( (end_s - $(date +%s)) / 86400 ))
          echo "certificate expires in $days days ($end)"
          [ "$days" -ge 14 ] || { echo "::error::TLS cert expires in $days days - renewal is not working"; exit 1; }
