name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            artifact_name: HumanityOS.exe
            asset_name: HumanityOS-windows-x64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            artifact_name: HumanityOS
            asset_name: HumanityOS-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            artifact_name: HumanityOS
            asset_name: HumanityOS-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            artifact_name: HumanityOS
            asset_name: HumanityOS-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The version is the one rust-toolchain.toml pins (one place to change it). rustup installs
      # that toolchain, and the target is added to it rather than to a separate "stable".
      - name: Install Rust (the version rust-toolchain.toml pins)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc -V

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build native engine (release)
        run: cargo build --release --target ${{ matrix.target }} --features native

      - name: Bundle binary with data
        shell: bash
        run: |
          mkdir -p dist/HumanityOS/assets
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/HumanityOS/${{ matrix.asset_name }}
          # Also stage the raw binary at dist/ root for the in-app updater to grab
          # without needing tar.gz extraction (BUG-034 fix, v0.124.0).
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}
          # DXC shader compiler DLLs (v0.865, Windows only): the exe prefers DXC
          # when dxcompiler.dll + dxil.dll sit beside it (boot ~25 s -> ~5 s;
          # graceful FXC fallback without them). The hosted runner's Windows SDK
          # ships both; bundle the newest. MIT-licensed, redistributable.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            SDKBIN=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 2>/dev/null | sort -V | tail -1)
            if [[ -n "$SDKBIN" && -f "$SDKBIN/dxcompiler.dll" && -f "$SDKBIN/dxil.dll" ]]; then
              cp "$SDKBIN/dxcompiler.dll" "$SDKBIN/dxil.dll" dist/HumanityOS/
              echo "Bundled DXC from $SDKBIN"
            else
              echo "WARNING: Windows SDK DXC DLLs not found; bundle will fall back to FXC (slow boot)"
            fi
          fi
          # Copy game data and assets.
          #
          # MODELS AND TEXTURES SHIP (fixed 2026-09-19). They did not, and the
          # consequence was that every downloaded build rendered the world as
          # untextured boxes: no plant meshes in a garden, no furniture, no
          # machine bodies. It read as "we only have one plant model" when in
          # fact a downloaded build had none at all, and only a build run from
          # a checkout ever looked right.
          #
          # On size, which is the obvious objection: the app READS all of
          # these at runtime, and the data folder we already ship is 586 MB,
          # most of it sky (a 241 MB star catalogue, a 100 MB galaxy image).
          # Models are 188 MB and textures 81 MB. Withholding the meshes a
          # player looks at while shipping the background they glance past is
          # not a size trade, it is an oversight. If the download must shrink,
          # the honest place to look is quality tiers and duplicated star
          # catalogues, not the things the game is made of.
          #
          # ONE LIST (2026-11-10): what ships beside the program is scripts/lib/release-files.js,
          # the list the data archive below and the per-file data manifest are made from too, so
          # the three can never disagree (scripts/tests/release-files.test.js checks it against
          # what the app reads). It carries data/, assets/icons, shaders, models, textures and
          # audio (the game's sounds, BUG-268: every effect, click and chime is a file there), and
          # LICENSE, LICENSES.md and CREDITS.md (2026-11-08: LICENSES.md holds the ODbL offer for
          # the OpenStreetMap region files and the CC BY-SA offer for the star catalogues, and a
          # download that carries those files must carry the offer too). It leaves out what the
          # app never reads, each rule with its reason in that file: the audio placeholders, and
          # the garments' full-resolution source PNGs (about 154 MiB: the app reads each garment's
          # .dds the converter made from them, and its .thumb.png).
          node scripts/lib/release-files.js --copy dist/HumanityOS
          # Create the bundle archives (binary + data + assets) for fresh installs.
          # BOTH formats: .zip opens natively on every OS (Windows Explorer, macOS
          # Finder, Linux file managers -- the no-friction choice for regular
          # people); .tar.gz stays for scripts/servers and existing tooling.
          # (.rar was considered and rejected: creating RAR requires proprietary
          # software our open CI can't use, and Windows 10 can't open it natively.)
          cd dist && tar czf HumanityOS-${{ matrix.label }}.tar.gz HumanityOS/
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip HumanityOS-${{ matrix.label }}.zip HumanityOS/ >/dev/null
          else
            zip -qr HumanityOS-${{ matrix.label }}.zip HumanityOS/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: humanity-${{ matrix.label }}
          path: |
            dist/HumanityOS-${{ matrix.label }}.tar.gz
            dist/HumanityOS-${{ matrix.label }}.zip
            dist/${{ matrix.asset_name }}

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: false
          files: |
            dist/HumanityOS-${{ matrix.label }}.tar.gz
            dist/HumanityOS-${{ matrix.label }}.zip
            dist/${{ matrix.asset_name }}

  # THE SELF-HOSTER'S BINARY (2026-08-12). Everything above builds the DESKTOP
  # app (--features native, GPU deps). A server does not want that: it wants the
  # headless relay, which is a completely different build.
  #
  # WHY THIS EXISTS: measured on the live VPS, RUNNING the relay costs 19.7 MB
  # RSS, 0.5% of one core, and a 26 MB binary. BUILDING it costs 1-2 GB of peak
  # rustc memory, 1.4 GB of target/, and 31-35 minutes on FOUR cores. So without
  # a prebuilt binary the minimum spec for a HumanityOS node is set by the
  # compiler, not by the software - which prices a small provider out of the
  # federation over a cost the software never actually incurs. With this
  # artifact a 1 GB / 1 core / 20 GB VPS is comfortable (30x headroom on RAM).
  relay:
    name: Build relay (linux-x64, headless)
    # Ubuntu 22.04 (glibc 2.35), not ubuntu-latest: on ubuntu-latest the relay needed GLIBC_2.39
    # (checked on public.guide's copy, 2026-10-30), so it would not start on Debian 12 (2.36) or
    # Ubuntu 22.04, which docs/admin/SELF-HOSTING.md supports. The check below keeps it so.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (the version rust-toolchain.toml pins)
        run: |
          rustup toolchain install
          rustc -V

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: relay-linux-2204-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: relay-linux-2204-cargo-

      # The exact feature set the VPS runs (deploy.yml and provision-vps.sh use
      # the same one). --no-default-features is what drops the GPU/windowing
      # stack; building with `native` would produce a binary a headless box
      # cannot even link against.
      - name: Build headless relay
        run: cargo build --release --features relay --no-default-features

      - name: Check it starts on Ubuntu 22.04 and Debian 12 (glibc 2.35)
        shell: bash
        run: |
          need=$(objdump -T target/release/HumanityOS | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "The relay needs glibc $need"
          if [ "$(printf '%s\n2.35\n' "$need" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::the relay needs glibc $need, newer than Ubuntu 22.04's 2.35"
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/HumanityOS dist/HumanityOS-relay-linux-x64
          sha256sum dist/HumanityOS-relay-linux-x64             > dist/HumanityOS-relay-linux-x64.sha256
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-linux-x64
          path: dist/HumanityOS-relay-linux-x64*
          retention-days: 14

      # Published on tags so a self-hoster can fetch a specific version rather
      # than whatever main happens to be. The .sha256 travels with it because a
      # binary downloaded over the network and run as a service should be
      # checkable, and provision-vps.sh verifies it.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: false
          files: |
            dist/HumanityOS-relay-linux-x64
            dist/HumanityOS-relay-linux-x64.sha256

  # Copy the release onto the VPS's release mirror (united-humanity.us/releases/<tag>/) and
  # rebuild its manifest. THE SERVER PULLS the files from this GitHub release (BUG-288,
  # 2026-11-09): /usr/local/bin/humanity-mirror-release (scripts/vps/humanity-mirror-release,
  # installed by every deploy from scripts/server-files.txt) lists the release's assets, fetches
  # the 14 the mirror holds with resume and a stall limit, checks each against GitHub's SHA-256,
  # moves the folder into place with one rename only when all match, and runs
  # regen-releases-manifest. Until then this job downloaded every build to the runner and pushed
  # about 4.4 GB to the server with appleboy/scp-action, which for v0.1552.0 hung for 1 h 42 min,
  # twice, despite its 15-minute command timeout (the path between the server and GitHub degrades
  # a long transfer; many short ones get through). It runs after `build` and `bundle-data`, so
  # every file it takes is already on the release. The two timeouts below mean a hang can never
  # again run for hours: the script stops itself at 50 minutes (exit 1, resumable), the ssh
  # session at 55, the job at 60. It fetches four files at once (the script's --parallel default):
  # one at a time, v0.1553.0 measured about 1 MB/s per connection and ran out of the 50 minutes at
  # 11 of 14 files (5.3 GB). If it fails, rerun the job or run
  # `ssh humanity-vps "humanity-mirror-release <tag>"` (docs/ai/release.md, "The server's copy of
  # each release"); a rerun resumes and never re-fetches a verified file.
  mirror-to-vps:
    name: Mirror binaries to VPS + regen manifest
    needs: [build, bundle-data]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The tag reaches the server through `envs`, never pasted into the script, and the script
      # refuses anything that is not a tag.
      - name: Pull the release onto the VPS and regenerate its manifest
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 55m
          envs: TAG
          script: |
            if [ ! -x /usr/local/bin/humanity-mirror-release ]; then
              echo "humanity-mirror-release is not installed on this server. Every deploy installs it (scripts/server-files.txt); by hand: bash /opt/Humanity/scripts/install-server-files.sh /opt/Humanity main"
              exit 1
            fi
            /usr/local/bin/humanity-mirror-release --max-minutes 50 "$TAG"

  # Bundle data files alongside the binary + generate per-file manifest
  bundle-data:
    name: Bundle data files
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create data archive
        run: |
          # Models and textures ship here too (fixed 2026-09-19): this archive
          # is what a fresh install unpacks, so leaving them out gave a world
          # of untextured boxes. See the note at the bundle copy above.
          # The files are scripts/lib/release-files.js's list (2026-11-10), the one the bundle
          # copy and the manifest below use: the same files in all three, each left-out rule with
          # its reason in that file. The list goes to tar one path a line, read verbatim.
          node scripts/lib/release-files.js --list > "$RUNNER_TEMP/release-files.txt"
          tar czf HumanityOS-data-${{ github.ref_name }}.tar.gz \
            --verbatim-files-from -T "$RUNNER_TEMP/release-files.txt"

      - name: Generate per-file data manifest
        run: node scripts/gen-data-manifest.js ${{ github.ref_name }}
        # Writes data-manifest-${tag}.json in repo root: exactly the archive's files (the same
        # list, scripts/lib/release-files.js).

      - name: Upload data bundle + manifest to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HumanityOS-data-${{ github.ref_name }}.tar.gz
            data-manifest-${{ github.ref_name }}.json
      # (No workflow artifact of these two any more: the mirror job used to carry them to the VPS
      # with the platform builds, and the server now fetches them from the release itself, BUG-288.)

  # Notify chat
  # THE one post per release in #announcements (operator, 2026-10-09: "a single announcement
  # that covers all the things that relate to it"). It names the release by its own title
  # (the tag commit's subject, "v0.1464.0: build on your own plot...") and links its notes.
  # Only after a successful build: it used to run on always() and say "binaries ready" after
  # a failed build too. The VPS deploy workflow no longer posts at all.
  notify:
    name: Notify chat
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The JSON is made here with jq, so a title with a quote or a backslash in it cannot
      # break the message (the old inline JSON silently dropped such posts).
      - name: Write the release's post
        id: post
        run: |
          TAG="${GITHUB_REF_NAME}"
          SUBJECT="$(git log -1 --format=%s)"
          TITLE="${SUBJECT#"$TAG: "}"
          TEXT="🚀 **${TAG}**: ${TITLE} · [Release notes](<https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}>)"
          PAYLOAD="$(jq -cn --arg c "$TEXT" '{channel:"announcements",content:$c,from_name:"Deploy Bot"}')"
          echo "$PAYLOAD"
          echo "b64=$(printf '%s' "$PAYLOAD" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Post it to #announcements
        uses: appleboy/ssh-action@v1
        env:
          PAYLOAD_B64: ${{ steps.post.outputs.b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PAYLOAD_B64
          script: |
            SECRET=$(grep '^API_SECRET' /opt/Humanity/.env | cut -d= -f2- | tr -d '\r')
            printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/announce-payload.json
            curl -s -X POST "http://localhost:3210/api/send" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${SECRET}" \
              --data-binary @/tmp/announce-payload.json || true
            rm -f /tmp/announce-payload.json
