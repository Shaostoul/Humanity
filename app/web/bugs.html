<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width,initial-scale=1.0>
  <title data-i18n="bugs.page_title">Bug Reports, HumanityOS</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    /* Colours this page uses that have no theme token. The dark values are
       exactly the page's look before the light theme reached its text
       (2026-10-20); the light ones are the theme's own danger and success. */
    :root {
      --pg-error-ink: #e55;
      --pg-ok-ink: #4a9;
    }
    :root[data-theme="light"] {
      --pg-error-ink: var(--danger);
      --pg-ok-ink: var(--success);
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    #page-app { flex: 1; max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; width: 100%; box-sizing: border-box; }

    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.3rem; }
    .page-header p { color: var(--text-muted); font-size: 0.85rem; margin: 0; }

    /* ---- Form ---- */
    .bug-form { background: var(--bg-card, #131313); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 2rem; }
    .bug-form h2 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; }
    .form-row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }
    .form-row.full { flex-direction: column; }
    .form-group { display: flex; flex-direction: column; flex: 1; }
    .form-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group label .req { color: var(--pg-error-ink); }
    .form-group input, .form-group textarea, .form-group select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.5rem 0.65rem; border-radius: 6px; font: inherit; font-size: 0.85rem;
      outline: none; transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--accent, #ed8c24);
    }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-group select { appearance: auto; }

    .form-actions { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.25rem; }
    .btn-submit {
      background: var(--accent, #ed8c24); color: var(--text-on-accent); border: none; padding: 0.55rem 1.5rem;
      border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
      transition: opacity 0.15s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .form-status { font-size: 0.8rem; color: var(--text-muted); }
    .form-status.error { color: var(--pg-error-ink); }
    .form-status.success { color: var(--pg-ok-ink); }

    .auto-captured { font-size: 0.72rem; color: var(--text-dim, #555); margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }

    .info-box { background: var(--bg-card, #131313); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.82rem; }
    .info-box a { color: var(--accent, #ed8c24); }

    /* ---- Bug list ---- */
    .bug-list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
    .bug-list-header h2 { font-size: 1rem; font-weight: 600; margin: 0; }
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filters select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.78rem;
    }

    .bug-card {
      background: var(--bg-card, #131313); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.85rem 1rem; margin-bottom: 0.5rem;
      transition: border-color 0.15s;
    }
    .bug-card:hover { border-color: var(--border-bright, #2a2a2a); }
    .bug-card-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; flex-wrap: wrap; }
    .bug-card-title { font-weight: 600; font-size: 0.9rem; flex: 1; min-width: 0; }

    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-critical { background: #7f1d1d; color: #fca5a5; }
    .badge-high { background: #78350f; color: #fbbf24; }
    .badge-medium { background: #1e3a5f; color: #93c5fd; }
    .badge-low { background: #14532d; color: #86efac; }
    .badge-cosmetic { background: #3b0764; color: #d8b4fe; } /* theme-exempt: a solid badge, its colour and ink a pair that reads on either ground */
    .badge-open { background: #064e3b; color: #6ee7b7; }
    .badge-in_progress { background: #78350f; color: #fde68a; }
    .badge-fixed { background: #1e3a5f; color: #93c5fd; }
    .badge-wont_fix { background: #333; color: #aaa; } /* theme-exempt: a solid badge, its colour and ink a pair that reads on either ground */
    .badge-duplicate { background: #333; color: #aaa; } /* theme-exempt: a solid badge, its colour and ink a pair that reads on either ground */

    .bug-card-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

    .vote-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .vote-btn:hover { border-color: var(--accent, #ed8c24); color: var(--accent, #ed8c24); }
    .vote-btn.voted { border-color: var(--accent, #ed8c24); color: var(--accent, #ed8c24); }

    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }

    .bug-card-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; max-height: 2.4em; overflow: hidden; text-overflow: ellipsis; }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<script src="/shared/i18n-en.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/shell.js" data-active="dev"></script>
<div id="page-app">
  <div class="page-header">
    <h1 data-i18n="bugs.heading">Bug Reports</h1>
    <p data-i18n="bugs.intro">Report issues or vote on existing bugs to help prioritize fixes.</p>
  </div>

  <div class="info-box">
    <span data-i18n="bugs.also_github">You can also report bugs on</span> <a href="https://github.com/Shaostoul/Humanity/issues" target="_blank" rel="noopener" data-i18n="bugs.github_issues" data-i18n-tip="bugs.github_hint" data-tip-desc="Opens the HumanityOS issue list on GitHub in a new tab, a public place to report problems.">GitHub Issues</a> <span data-i18n="bugs.also_github_after">for public tracking.</span>
  </div>

  <!-- Report form -->
  <div class="bug-form">
    <h2 data-i18n="bugs.report_a_bug">Report a Bug</h2>
    <form id="bug-form" autocomplete="off">
      <div class="form-row">
        <div class="form-group">
          <label><span data-i18n="bugs.title_label">Title</span> <span class="req">*</span></label>
          <input type="text" id="bug-title" required maxlength="500" placeholder="Short summary of the issue" data-i18n-placeholder="bugs.title_placeholder_web" data-i18n-tip="bugs.title_hint" data-tip-desc="A short line that says what went wrong.">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label><span data-i18n="bugs.description">Description</span> <span class="req">*</span></label>
          <textarea id="bug-description" required maxlength="10000" placeholder="What happened? Provide as much detail as possible." data-i18n-placeholder="bugs.description_placeholder_web" data-i18n-tip="bugs.description_hint" data-tip-desc="Say what you were doing, what you expected, and what happened instead."></textarea>
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label data-i18n="bugs.steps">Steps to Reproduce</label>
          <textarea id="bug-steps" placeholder="1. Go to ...&#10;2. Click on ...&#10;3. See error" data-i18n-placeholder="bugs.steps_placeholder" data-i18n-tip="bugs.steps_hint" data-tip-desc="List what you did, one step per line, so someone else can make the same thing happen."></textarea>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="bugs.expected">Expected Behavior</label>
          <input type="text" id="bug-expected" placeholder="What should have happened" data-i18n-placeholder="bugs.expected_placeholder" data-i18n-tip="bugs.expected_hint" data-tip-desc="Say what you thought would happen.">
        </div>
        <div class="form-group">
          <label data-i18n="bugs.actual">Actual Behavior</label>
          <input type="text" id="bug-actual" placeholder="What actually happened" data-i18n-placeholder="bugs.actual_placeholder" data-i18n-tip="bugs.actual_hint" data-tip-desc="Say what happened instead.">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="bug-severity" data-i18n="bugs.severity">Severity</label>
          <select id="bug-severity" data-i18n-tip="bugs.severity_hint_web" data-tip-desc="Choose how badly this gets in the way, from Critical (the app cannot be used) down to Cosmetic (it only looks wrong).">
            <option value="critical" data-i18n="bugs.sev_critical_long">Critical - app unusable</option>
            <option value="high" data-i18n="bugs.sev_high_long">High - major feature broken</option>
            <option value="medium" selected data-i18n="bugs.sev_medium_long">Medium - feature impaired</option>
            <option value="low" data-i18n="bugs.sev_low_long">Low - minor issue</option>
            <option value="cosmetic" data-i18n="bugs.sev_cosmetic_long">Cosmetic - visual only</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bug-category" data-i18n="bugs.category">Category</label>
          <select id="bug-category" data-i18n-tip="bugs.category_hint" data-tip-desc="Choose which part of the app the problem is in.">
            <option value="chat" data-i18n="bugs.cat_chat">Chat</option>
            <option value="tasks" data-i18n="bugs.cat_tasks">Tasks</option>
            <option value="market" data-i18n="bugs.cat_market">Market</option>
            <option value="wallet" data-i18n="bugs.cat_wallet">Wallet</option>
            <option value="maps" data-i18n="bugs.cat_maps">Maps</option>
            <option value="game" data-i18n="bugs.cat_game">Game</option>
            <option value="settings" data-i18n="bugs.cat_settings">Settings</option>
            <option value="other" selected data-i18n="bugs.cat_other">Other</option>
          </select>
        </div>
      </div>
      <div class="auto-captured" id="auto-captured" data-i18n="bugs.auto_captured">
        Auto-captured: browser, screen size, page URL, app version, your public key (if logged in)
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-submit" id="btn-submit" data-i18n="bugs.submit_web" data-i18n-tip="bugs.submit_web_hint" data-tip-desc="Sends this report to the server, where other members and the maintainers can read it. The details listed just above go with it.">Submit Bug Report</button>
        <span class="form-status" id="form-status"></span>
      </div>
    </form>
  </div>

  <!-- Bug list -->
  <div class="bug-list-header">
    <h2 data-i18n="bugs.known">Known Bugs</h2>
    <div class="filters">
      <select data-i18n-aria-label="bugs.filter_status_label" aria-label="Show reports with this status" id="filter-status" data-i18n-tip="bugs.filter_status_hint" data-tip-desc="Shows only the reports with the status you choose.">
        <option value="" data-i18n="bugs.all_statuses">All Statuses</option>
        <option value="open" data-i18n="bugs.status_open">Open</option>
        <option value="in_progress" data-i18n="bugs.status_in_progress">In Progress</option>
        <option value="fixed" data-i18n="bugs.status_fixed">Fixed</option>
        <option value="wont_fix" data-i18n="bugs.status_wont_fix">Won't Fix</option>
        <option value="duplicate" data-i18n="bugs.status_duplicate">Duplicate</option>
      </select>
      <select data-i18n-aria-label="bugs.filter_severity_label" aria-label="Show reports this serious" id="filter-severity" data-i18n-tip="bugs.filter_severity_hint" data-tip-desc="Shows only the reports as serious as you choose.">
        <option value="" data-i18n="bugs.all_severities">All Severities</option>
        <option value="critical" data-i18n="bugs.sev_critical">Critical</option>
        <option value="high" data-i18n="bugs.sev_high">High</option>
        <option value="medium" data-i18n="bugs.sev_medium">Medium</option>
        <option value="low" data-i18n="bugs.sev_low">Low</option>
        <option value="cosmetic" data-i18n="bugs.sev_cosmetic">Cosmetic</option>
      </select>
      <select data-i18n-aria-label="bugs.filter_category_label" aria-label="Show reports about this part of the app" id="filter-category" data-i18n-tip="bugs.filter_category_hint" data-tip-desc="Shows only the reports about the part of the app you choose.">
        <option value="" data-i18n="bugs.all_categories">All Categories</option>
        <option value="chat" data-i18n="bugs.cat_chat">Chat</option>
        <option value="tasks" data-i18n="bugs.cat_tasks">Tasks</option>
        <option value="market" data-i18n="bugs.cat_market">Market</option>
        <option value="wallet" data-i18n="bugs.cat_wallet">Wallet</option>
        <option value="maps" data-i18n="bugs.cat_maps">Maps</option>
        <option value="game" data-i18n="bugs.cat_game">Game</option>
        <option value="settings" data-i18n="bugs.cat_settings">Settings</option>
        <option value="other" data-i18n="bugs.cat_other">Other</option>
      </select>
    </div>
  </div>
  <div id="bug-list"></div>
</div>

<!-- Dilithium identity bridge for the signed bug vote (POST /api/bugs/{id}/vote). -->
<!-- `pq.js` installs window.pqDeriveIdentity + window.pqSignMessage; -->
<!-- `pq-relay-auth.js` installs window.getPqSignedAuth, which reads the seed -->
<!-- from the localStorage backup Chat writes (no WebCrypto Ed25519 needed). -->
<script src="/chat/pq.js?v=1"></script>
<script src="/shared/pq-relay-auth.js?v=2"></script>
<script src="/pages/bugs-app.js"></script>
</body>
</html>
