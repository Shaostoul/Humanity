# THE MOTHERSHIP'S SPACE PROGRAM: how big the ship has to be, measured from the bottom up.
#
# The operator, 2026-11-06: "How do we end up measuring the total size of the ship? Do we need to
# plot the size for each home, hangar, engineering bay, industrial zone, reactor room, bridge,
# storage areas, transportation like railways and elevetors, etc?"
#
# Yes. Architects size a building, and NASA's 1975 summer study sized a space settlement, the same
# way: list every kind of space, give each an area per person (or per unit, with how many people
# one unit serves), multiply by the population, add circulation and structure, and the total is
# the size. This file is that list. Change a number and the ship changes with it:
#
#     node scripts/space-program.js 1000          (totals for 1,000 people, and whether Drum 1 holds them)
#     node scripts/space-program.js 10000 --mix homestead=0.05,cabin=0.25,apartment=0.70
#     node scripts/space-program.js --sector      (the 500-person sector: its drum, walks, noise)
#     node scripts/space-program.js --scale       (1 and 10 billion: drums, ships, the fleet)
#     node scripts/space-program.js --sources     (where every number comes from)
#
# The design that uses it: docs/design/mothership-master-plan.md, sections 3.12, 3.15 and 3.16. The
# sources, quoted and dated: docs/reference/findings/2026-11-06-space-program-sources.md (the areas),
# 2026-11-07-community-size.md (the 500-person sector and its layers) and
# 2026-11-07-drum-limits.md (hoop stress, spin stability, the lean). Every row says which source it
# rests on (`source`, a key of the [[source]] table at the end), and "proposal" marks a number this
# project chose with no outside source behind it.
#
# WORDS (2026-11-07): a SECTOR is a community of 500 residents, the operator's unit ("Let's start
# with a sector for 500 people."). A DRUM is a spinning cylinder that holds sectors; Drum 1 is the
# 250 m x 2 km drum the operator sized on 2026-09-15 (until 2026-11-07 this file called it
# "Sector 1"). Sector 1 is now the first 500-person sector, at the fore end of Drum 1.
#
# The game does not read this file yet: scripts/space-program.js is its reader. When neighbourhoods
# become data (the master plan's rung 3), the generator and the planning-rule tests read it too.
#
# HOW A ROW IS COUNTED
#   zone      where it goes: "drum" (the spinning drum's floor, 1 g; the area that counts is the
#             FLOOR it covers, its gross area divided by its `levels`), "spine" (the non-rotating
#             spine's decks; deck area), "bow" (the docking end's decks), "stern" (the drive),
#             "end_cap" (the drum's end walls: lifts and risers), "exterior" (outside the hull:
#             radiator fins). Only drum, spine and bow are checked against the room Drum 1 has.
#   per       "person" (m2_per_person times the people it serves), "unit" (unit_m2 times
#             ceil(people / people_per_unit), at least min_units, plus spare_units),
#             "neighbourhood" (unit_m2 per neighbourhood), "sector" (unit_m2 per 500-person
#             sector), "drum" (units_per_drum, once for the drum the population lives in), "ship"
#             (once for the whole ship).
#   farm      true for the ship's farm rows: their storeys come from [farms] levels (the operator,
#             2026-11-07: one level to start, two or more allowed), not from the row.
#   who       the people a per-person or per-unit row serves: "all" (default) or "fed_by_ship"
#             (everyone whose home does not grow its own food: the ship's farms feed them).
#   net       true when the area is the room alone; the indoor circulation multiplier and the
#             structure allowance below are then added. false when the source's figure already
#             includes walkways and access (NASA SP-413's figures do).
#   levels    how many storeys the space stacks into on the drum floor (NASA SP-413's "No. of
#             levels"); the floor it covers is its area divided by this.
#   min_m2    the least area the row may have whatever the population (a hospital needs a room
#             even for 100 people).
#   min_m2_per_neighbourhood   the same, per neighbourhood (the WHO's green space near every home).

schema = 1

[defaults]
# Used when the command line gives no population: one sector.
population = 500
# A neighbourhood: about 150 people around one node, never grown past about 200; three to a
# 500-person sector (the community-size finding: Hutterite colonies split at a mean of 166, Alpine
# commons held a mean of 176 and a median of 140; its judgement table, "three per sector, each one
# split rather than grown past about 200"). The per-neighbourhood rows and the WHO green-space
# minimum count neighbourhoods as ceil(population / neighbourhood_people).
neighbourhood_people = 167
# GSA, "Circulation: Defining and Planning" (2012): "Circulation Multipliers will typically range
# between 1.4 to 1.6." The low end, because the ship's buildings are mostly enclosed rooms.
indoor_circulation = 1.4
# Walls, columns, shafts, ducts and service runs inside buildings, as a share of a net room's area
# after circulation. Proposal: no outside source was found for one figure (finding, unknowns).
structure_allowance = 0.10

# ---------------------------------------------------------------------------------------------
# THE SECTOR: the community every drum is built from
#
# The operator, 2026-11-07: "Let's start with a sector for 500 people. I've heard that communities
# of 500 people is about the upper limit for one massive group to work together. Can you research
# that number?" The research (docs/reference/findings/2026-11-07-community-size.md): about 500 is
# the layer of acquaintances, everyone known well enough to talk with, and the size past which
# communities in the record need a formal structure; the group held together by personal ties is
# about 150. So the sector keeps his 500 as its cap and builds the smaller layers into its space.

[sector]
residents = 500
# The layers inside a sector, smallest first, at a ratio of about three (the finding's judgement
# table): a home of about 5, a cluster of 3 homes sharing a court, a block of 3 clusters on one
# street or storey, a neighbourhood of 3 blocks around its node, the sector of 3 neighbourhoods
# sharing civic places, and a district of 3 sectors sharing the larger ones. Reported by
# `--sector`; the layout generator (master plan rung 3) builds them.
layers = [
    # [name, people]
    ["home", 5],
    ["cluster", 15],
    ["block", 50],
    ["neighbourhood", 167],
    ["sector", 500],
    ["district", 1500],
]
# Walking speed for the walk-time checks: the master plan's design speed (section 3.11).
walk_m_per_s = 1.4
# The planning rules the layout is held to (master plan 3.13 and ship-homes-and-logistics.md 2.9):
# a mess hall (the neighbourhood's node) within 5 minutes of every home, every daily need within 15.
node_walk_max_s = 300
daily_walk_max_s = 900

# ---------------------------------------------------------------------------------------------
# THE DRUM THE PROGRAM IS CHECKED AGAINST
#
# Drum 1 as the master plan lays it out: the drum the operator sized (250 m radius, 2 km long,
# decided 2026-09-15) and the spine segment that runs through it (60 m across, decks every 5 m,
# every 10 m for industry; master plan section 3.3, Proposal). The bow is checked alongside it:
# it is not part of a drum, but Drum 1's people dock and store their craft there.

[drum]
id = "d1"
name = "Drum 1"
drum_radius_m = 250.0
drum_length_m = 2000.0
# Share of the drum floor the program may use. 1.0: streets, parks and farms are rows of the
# program, so nothing is held back twice.
drum_usable = 1.0
spine_radius_m = 30.0
# Share of each spine deck left after the axial rail, the lift shafts and the utility trunks.
# Proposal.
spine_usable = 0.8
# The spine segment's stretches, fore to aft, each with its deck spacing (master plan section 3.3).
spine_segments = [
    # [from_m, to_m, deck spacing m]
    [0.0, 150.0, 5.0],      # fore hub: the spoke lifts' tops, the passenger rail station
    [150.0, 900.0, 5.0],    # storage and the cargo tunnels
    [900.0, 1500.0, 10.0],  # industry
    [1500.0, 1850.0, 5.0],  # drum engineering: reactors, air, water, waste
    [1850.0, 2000.0, 5.0],  # aft hub: freight lifts, utility risers
]
# The shell over the drum: radiation shielding by mass per square metre of hull (closed-loop-test.md,
# 4.5 t/m2). Reported, not checked: it is hull, not floor.
shield_t_per_m2 = 4.5

# The ship's farms. The operator, 2026-11-07, on one level of farms or two: "Let's start with one
# but, allow for two or more." Every row marked `farm = true` stacks into this many levels on the
# drum floor; `--farm-levels 2` runs the program with two.
[farms]
levels = 1

[bow]
radius_m = 60.0
length_m = 300.0
# Hangars need height: a deck every 15 m.
deck_spacing_m = 15.0
usable = 0.7

# ---------------------------------------------------------------------------------------------
# HOMES: who lives in what. `share` is the share of RESIDENTS (they sum to 1). The default mix is
# a Proposal: the master plan's bands hold about 85 homesteads (N1's 12 and the homestead ring's
# H1 to H4), so a few per cent of a full drum's people are homesteaders; most live in cabins and
# apartment blocks by the landing, and the ship's farms feed them (decided 2026-10-03).

[[home]]
id = "homestead"
name = "Homestead"
share = 0.08
people_per_home = 2.5
# The shipped design's plot, 55 x 89 m (data/homes/homestead.ron).
plot_m2 = 4895.0
# The plot plus its share of the 10 m street in front and the 10 m gap beside it, from rung 1's
# N1 layout (a 65 x 99 m cell per 55 x 89 m plot; computed).
plot_gross = 1.315
# The homestead grows its own food on its acre (decided 2026-10-03), so its residents need no
# ship farm.
feeds_itself = true
# Its garden: the comfortable garden, which the operator chose as every new homesteader's start on
# 2026-11-07 ("The comfortable one."): the floor one resident's garden takes with its paths, from
# docs/design/survival-garden.md's generated block (comfort tier, lit canopy x the path factor).
# The program checks that the household's gardens fit the homestead design's greenhouse.
garden_m2_per_person = 122.2
# The shipped homestead's greenhouse, x 10..55 by z 51..73 (survival-garden.md section 7).
greenhouse_m2 = 990.0
source = "ship-homes"

[[home]]
id = "cabin"
name = "Cabin"
share = 0.22
people_per_home = 1.0
# A single bedroom, "no less than 7.5 m2" (Nationally Described Space Standard, cited in
# ship-homes-and-logistics.md section 1.2).
unit_m2 = 7.5
# The block's shared rooms per resident: washrooms, laundry, lockers. Proposal.
shared_m2 = 2.0
# A cabin block may stack: tight-packed arrangements may be multi-storey (decided 2026-11-06).
storeys = 2
net = true
feeds_itself = false
source = "ship-homes"

[[home]]
id = "apartment"
name = "Apartment"
share = 0.70
# The block's own data: storeys, units, the atrium, lifts and stairs. Its residents and the floor
# it covers come from there.
template = "blocks/apartment_atrium.toml"
feeds_itself = false
source = "ship-homes"

