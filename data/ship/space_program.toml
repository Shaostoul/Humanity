# ---------------------------------------------------------------------------------------------
# NOISE: the night limit the sector's loud rooms are checked against (master plan 3.13, from the
# noise-and-sleep finding: at most 40 dB Lnight at every home's facade). The estimate is 3.13's
# free-field one over a hard floor: Lp = Lw - 20 log10(r) - 8 - (the walls' loss).

[noise]
night_facade_db = 40.0
hard_floor_db = 8.0

# ---------------------------------------------------------------------------------------------
# SCALE: one billion and ten billion (the operator, 2026-11-07: "Let's aim for 1 billion and 10
# billion."). `--scale` works out how many sectors, what drums hold them, whether one ship can, and
# the fleet if not. The limits it tests are real physics, sourced in
# docs/reference/findings/2026-11-07-drum-limits.md; the jump that moves the ships is a game
# fiction and plays no part here.

[scale]
populations = [1_000_000_000, 10_000_000_000]
# Every structure is designed to carry this many times its working load. Proposal.
safety_factor = 2.0
# The drum's air: sea-level pressure. Assumption: a lower pressure lightens every drum.
air_kpa = 101.325
# What the rim carries per m2 of floor besides air: floors, buildings, beds, water, people.
# Proposal: no sourced figure.
contents_t_per_m2 = 1.0
# The radiation shield (closed-loop-test.md, 4.5 t/m2) as a NON-rotating shell around the drums,
# the "unattached stationary shielding" design Jensen 2024 reports from NASA's 1979 study, so the
# shield carries no spin load and the drums carry no shield. Proposal.
shield_t_per_m2 = 4.5
# A free-flying cylinder spins stably about its long axis only up to about 1.3 radii long
# (Globus et al. 2007, reproduced by Jensen 2024's thin-shell analysis).
stability_l_over_r = 1.3
# Between drums along the spine: the end walls, the bearings, the lifts' tops. Proposal.
drum_gap_m = 50.0
# Thrust is for manoeuvring only (the cruise is the jump, a game fiction): routinely at most
# 0.02 g (a lean of 1.15 degrees, flatter than the 1:48 cross slope the ADA allows any walkway),
# and never more than 0.05 g (2.86 degrees, the ADA's 1:20 limit for a walking surface that is not
# a ramp). The spine is sized for the larger.
manoeuvre_routine_g = 0.02
manoeuvre_max_g = 0.05
# The spine may weigh at most this share of what it carries. Proposal.
spine_mass_share = 0.10
spine_material = "carbon_composite"
hull_material = "carbon_composite"
# For "how big a rock is that": a rubble-pile asteroid's bulk density. Assumption.
rock_density_kg_m3 = 2000.0
# The main asteroid belt's mass: (4.008 +/- 0.029) x 10^-4 Earth masses (Pitjeva and Pitjev 2018)
# x 5.972 x 10^24 kg.
main_belt_kg = 2.394e21

# The drum sizes the scale study compares. Drum 1's radius is the operator's (2026-09-15); the
# larger spins at 0.95 rpm, inside NASA SP-413's "1 rpm" (master plan 3.13), and holds four times
# the people per kilometre of spine.
[[drum_class]]
id = "r250"
name = "Drum 1's radius (250 m, 1.89 rpm)"
radius_m = 250.0
spine_radius_m = 30.0

[[drum_class]]
id = "r1000"
name = "The bulk drum (1 km, 0.95 rpm)"
radius_m = 1000.0
spine_radius_m = 60.0

# Structural materials: working strength in tension and density.
[[material]]
id = "steel"
name = "High-strength steel (SSAB Strenx P700)"
strength_mpa = 700.0
density_kg_m3 = 7850.0
source = "drum-limits"

[[material]]
id = "aramid_composite"
name = "Aramid composite (Kevlar 49 fibre, 60% by volume in resin)"
# The fibre's 2,760 MPa x 0.6 (the fibres carry the load; the resin's share is ignored), and
# 1,440 x 0.6 + an assumed resin of 1,200 x 0.4 kg/m3. Computed.
strength_mpa = 1656.0
density_kg_m3 = 1344.0
source = "drum-limits"

[[material]]
id = "carbon_composite"
name = "Carbon fibre composite (Toray T700S in epoxy, 60% fibre)"
# Toray's own composite figure, 2,550 MPa at 60% fibre volume; density 1,800 x 0.6 + an assumed
# resin of 1,200 x 0.4 kg/m3. Computed.
strength_mpa = 2550.0
density_kg_m3 = 1560.0
# Toray's composite tensile modulus, for the spine's buckling check.
modulus_gpa = 135.0
source = "drum-limits"

